<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>URL 공유 렌쥬 오목</title>
    <style>
        * { box-sizing: border-box; }

        /* 다크 모드 배경 및 글자색 적용 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #000000;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 데스크톱 & DEX 기본 디자인 (가로 배치) */
        .container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        #board-container {
            position: relative;
            width: 85vh;
            max-width: 70vw;
            aspect-ratio: 1 / 1;
            background-color: #e6b873;
            border: 4px solid #111;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            border-radius: 4px;
            -webkit-user-select: none;
            user-select: none;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        #board-container.game-over {
            cursor: default;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 오른쪽 사이드 패널 (상태창 + 버튼들) */
        .side-panel {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* 상태창 다크 모드 적용 */
        .status-box {
            padding: 15px;
            background: #2d2d2d;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            color: #f3f4f6;
            border: 1px solid transparent;
        }

        .status-box.winner { background: #064e3b; border-color: #059669; color: #a7f3d0; }
        .status-box.draw { background: #7c2d12; border-color: #ea580c; color: #fed7aa; }

        .turn-indicator {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        .turn-B { background: black; border: 1px solid #555; }
        .turn-W { background: white; border: 1px solid #ccc; }
        .turn-D { background: #f59e0b; }

        /* 버튼 영역 */
        .controls-container { display: flex; flex-direction: column; gap: 10px; }
        .row-1, .row-2 { display: flex; gap: 8px; width: 100%; align-items: stretch; justify-content: space-between; }
        
        button {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }
        
        button:active { transform: scale(0.96); }
        button.keyboard-active { transform: scale(0.96); filter: brightness(0.9); }
        
        /* 첫째줄: 네비게이션 및 수순창 */
        .row-1 > button { flex: 1; padding: 12px 4px; font-size: 18px; font-weight: bold; }
        
        /* 둘째줄: 부가 기능 버튼 */
        .row-2 > button { flex: 1; padding: 12px 2px; font-size: 14px; font-weight: bold; white-space: nowrap; letter-spacing: -0.5px; }

        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-info { background-color: #0284c7; color: white; }
        .btn-capture { background-color: #be185d; color: white; }
        .btn-review { background-color: #9333ea; color: white; }
        .btn-review.active { background-color: #dc2626; animation: pulse 1.5s infinite; }
        
        .btn-nav { background-color: #4b5563; color: white; }

        /* 수순 입력창 다크 모드 적용 */
        #move-input {
            flex: 2; width: 100%; text-align: center; font-size: 18px; font-weight: bold;
            border: 2px solid #555; border-radius: 6px; outline: none;
            background: #1f2937; color: #f3f4f6;
        }
        #move-input:focus { border-color: #4f46e5; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 모바일 화면 디자인 */
        @media (max-width: 800px) {
            body {
                padding: 0;
                background-color: #000000;
                align-items: flex-start;
            }

            .container {
                flex-direction: column;
                align-items: center;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                gap: 10px;
                background: transparent;
            }

            #board-container {
                width: 100vw;
                max-width: 100vw;
                flex: none;
                border-left: none;
                border-right: none;
                border-radius: 0;
                border-width: 2px 0;
            }

            .side-panel {
                flex: none;
                width: 100%;
                max-width: 100%;
                padding: 0 10px 20px 10px;
                gap: 10px;
            }

            .row-2 > button {
                font-size: 13px;
                padding: 12px 2px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="board-container">
        <svg id="omok-board" viewBox="0 0 320 320"></svg>
    </div>

    <div class="side-panel">
        <div class="status-box" id="status-box">
            <span id="turn-color" class="turn-indicator turn-B"></span>
            <span id="status-text">대기 중</span>
        </div>

        <div class="controls-container">
            <!-- 첫째줄: 네비게이션 -->
            <div class="row-1">
                <button id="btn-prev-move" class="btn-nav" onclick="goPrevMove()" title="왼쪽 방향키 (◀)">◀</button>
                <input type="number" id="move-input" min="0" value="0" onkeydown="handleInputEnter(event)" onblur="jumpToMove()">
                <button id="btn-next-move" class="btn-nav" onclick="goNextMove()" title="오른쪽 방향키 (▶)">▶</button>
            </div>
            <!-- 둘째줄: 부가 기능 -->
            <div class="row-2">
                <button class="btn-primary" onclick="copyLink()">🔗 링크복사</button>
                <button class="btn-info" onclick="toggleMoveNumbers()">🔢 수순표시</button>
                <button class="btn-capture" onclick="captureBoard()">📸 캡쳐</button>
                <button id="btn-review" class="btn-review" onclick="toggleReviewMode()" title="E">🔍 검토</button>
            </div>
        </div>
    </div>
</div>

<script>
    const size = 15;
    const chars = 'abcdefghijklmno';
    const svg = document.getElementById('omok-board');
    const boardContainer = document.getElementById('board-container');
    const statusBox = document.getElementById('status-box');
    const pad = 16;
    const step = 20;

    const DIRECTIONS = [
        [1, 0],   // 가로
        [0, 1],   // 세로
        [1, 1],   // 좌상-우하 대각선
        [1, -1]   // 좌하-우상 대각선
    ];

    let currentMoveIndex = 0;       
    let showMoveNumbers = false;    
    let isReviewMode = false;       
    let savedReviewState = null; 
    let currentGameState = null;

    function makeEmptyBoard() {
        return Array.from({ length: size }, () => Array(size).fill(null));
    }

    function isInside(x, y) {
        return x >= 0 && x < size && y >= 0 && y < size;
    }

    function getColor(board, x, y) {
        if (!isInside(x, y) || board[y][x] === null) return null;
        return board[y][x].color;
    }

    function putTemporaryBlack(board, x, y) {
        board[y][x] = { color: 'B', no: 0 };
    }

    function removeTemporaryStone(board, x, y) {
        board[y][x] = null;
    }

    function initBoardLayout() {
        let html = '<g id="grid-lines">';

        for (let i = 0; i < size; i++) {
            const pos = pad + i * step;
            html += `<line x1="${pad}" y1="${pos}" x2="${pad + (size - 1) * step}" y2="${pos}" stroke="#444" stroke-width="0.8"/>`;
            html += `<line x1="${pos}" y1="${pad}" x2="${pos}" y2="${pad + (size - 1) * step}" stroke="#444" stroke-width="0.8"/>`;
        }

        const center = 7;
        const side = 3;
        const stars = [side, center, size - 1 - side];

        stars.forEach(cx => {
            stars.forEach(cy => {
                html += `<circle cx="${pad + cx * step}" cy="${pad + cy * step}" r="2.2" fill="#222"/>`;
            });
        });

        html += '</g><g id="stones"></g>';
        svg.innerHTML = html;
    }

    // --- 오목 렌쥬 룰 (승리, 금수) 판정 로직 ---
    function getLineLength(board, x, y, dx, dy, color) {
        if (getColor(board, x, y) !== color) return 0;
        let count = 1;
        let nx = x + dx, ny = y + dy;
        while (isInside(nx, ny) && getColor(board, nx, ny) === color) { count++; nx += dx; ny += dy; }
        nx = x - dx; ny = y - dy;
        while (isInside(nx, ny) && getColor(board, nx, ny) === color) { count++; nx -= dx; ny -= dy; }
        return count;
    }

    function hasExactFiveAt(board, x, y, color) {
        return DIRECTIONS.some(([dx, dy]) => getLineLength(board, x, y, dx, dy, color) === 5);
    }

    function hasFiveOrMoreAt(board, x, y, color) {
        return DIRECTIONS.some(([dx, dy]) => getLineLength(board, x, y, dx, dy, color) >= 5);
    }

    function hasOverlineAt(board, x, y) {
        return DIRECTIONS.some(([dx, dy]) => getLineLength(board, x, y, dx, dy, 'B') >= 6);
    }

    function serializeBoard(board) {
        let result = '';
        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                result += board[y][x] === null ? '.' : board[y][x].color;
            }
        }
        return result;
    }

    function coordinateKey(x, y) {
        return `${x},${y}`;
    }

    function countFoursMadeBy(board, originX, originY) {
        const fours = new Set();
        DIRECTIONS.forEach(([dx, dy], directionIndex) => {
            for (let startOffset = -4; startOffset <= 0; startOffset++) {
                const positions = [];
                let validWindow = true;
                for (let i = 0; i < 5; i++) {
                    const x = originX + (startOffset + i) * dx;
                    const y = originY + (startOffset + i) * dy;
                    if (!isInside(x, y)) { validWindow = false; break; }
                    positions.push({ x, y });
                }
                if (!validWindow) continue;

                let blackCount = 0;
                const emptyPoints = [];
                const blackPoints = [];

                positions.forEach(({ x, y }) => {
                    const color = getColor(board, x, y);
                    if (color === 'B') { blackCount++; blackPoints.push(coordinateKey(x, y)); } 
                    else if (color === null) { emptyPoints.push({ x, y }); }
                });

                if (blackCount !== 4 || emptyPoints.length !== 1) continue;
                if (!blackPoints.includes(coordinateKey(originX, originY))) continue;

                const empty = emptyPoints[0];
                putTemporaryBlack(board, empty.x, empty.y);
                const makesExactFive = getLineLength(board, empty.x, empty.y, dx, dy, 'B') === 5;
                removeTemporaryStone(board, empty.x, empty.y);

                if (!makesExactFive) continue;
                blackPoints.sort();
                fours.add(`${directionIndex}:${blackPoints.join('|')}`);
            }
        });
        return fours.size;
    }

    function getStraightFoursInDirection(board, originX, originY, extensionX, extensionY, dx, dy, directionIndex) {
        const straightFours = [];
        const seen = new Set();

        for (let startOffset = -3; startOffset <= 0; startOffset++) {
            const stones = [];
            let valid = true;
            for (let i = 0; i < 4; i++) {
                const x = originX + (startOffset + i) * dx;
                const y = originY + (startOffset + i) * dy;
                if (!isInside(x, y) || getColor(board, x, y) !== 'B') { valid = false; break; }
                stones.push({ x, y });
            }
            if (!valid) continue;

            const includesExtension = stones.some(point => point.x === extensionX && point.y === extensionY);
            if (!includesExtension) continue;

            const left = { x: originX + (startOffset - 1) * dx, y: originY + (startOffset - 1) * dy };
            const right = { x: originX + (startOffset + 4) * dx, y: originY + (startOffset + 4) * dy };

            if (!isInside(left.x, left.y) || !isInside(right.x, right.y)) continue;
            if (getColor(board, left.x, left.y) !== null) continue;
            if (getColor(board, right.x, right.y) !== null) continue;

            putTemporaryBlack(board, left.x, left.y);
            const leftMakesExactFive = getLineLength(board, left.x, left.y, dx, dy, 'B') === 5;
            removeTemporaryStone(board, left.x, left.y);

            putTemporaryBlack(board, right.x, right.y);
            const rightMakesExactFive = getLineLength(board, right.x, right.y, dx, dy, 'B') === 5;
            removeTemporaryStone(board, right.x, right.y);

            if (!leftMakesExactFive || !rightMakesExactFive) continue;

            const key = `${directionIndex}:${stones.map(point => coordinateKey(point.x, point.y)).sort().join('|')}`;
            if (!seen.has(key)) { seen.add(key); straightFours.push({ directionIndex, stones }); }
        }
        return straightFours;
    }

    function countLegalThreesMadeBy(board, originX, originY, memo) {
        const threes = new Set();
        DIRECTIONS.forEach(([dx, dy], directionIndex) => {
            for (let distance = -3; distance <= 3; distance++) {
                if (distance === 0) continue;
                const extensionX = originX + distance * dx;
                const extensionY = originY + distance * dy;
                if (!isInside(extensionX, extensionY)) continue;
                if (board[extensionY][extensionX] !== null) continue;

                putTemporaryBlack(board, extensionX, extensionY);
                const makesFive = hasExactFiveAt(board, extensionX, extensionY, 'B');
                const straightFours = makesFive ? [] : getStraightFoursInDirection(board, originX, originY, extensionX, extensionY, dx, dy, directionIndex);
                removeTemporaryStone(board, extensionX, extensionY);

                if (straightFours.length === 0) continue;
                if (isForbiddenBlackMove(board, extensionX, extensionY, memo)) continue;

                straightFours.forEach(straightFour => {
                    const originalThree = straightFour.stones.filter(point => point.x !== extensionX || point.y !== extensionY);
                    if (originalThree.length !== 3) return;
                    const includesOrigin = originalThree.some(point => point.x === originX && point.y === originY);
                    if (!includesOrigin) return;

                    const key = `${directionIndex}:${originalThree.map(point => coordinateKey(point.x, point.y)).sort().join('|')}`;
                    threes.add(key);
                });
            }
        });
        return threes.size;
    }

    function isForbiddenBlackMove(board, x, y, memo = new Map()) {
        if (!isInside(x, y) || board[y][x] !== null) return true;
        const memoKey = `${serializeBoard(board)}:${x},${y}`;
        if (memo.has(memoKey)) return memo.get(memoKey);

        putTemporaryBlack(board, x, y);
        let forbidden = false;

        if (hasExactFiveAt(board, x, y, 'B')) { forbidden = false; } 
        else if (hasOverlineAt(board, x, y)) { forbidden = true; } 
        else if (countFoursMadeBy(board, x, y) >= 2) { forbidden = true; } 
        else if (countLegalThreesMadeBy(board, x, y, memo) >= 2) { forbidden = true; }

        removeTemporaryStone(board, x, y);
        memo.set(memoKey, forbidden);
        return forbidden;
    }

    function getWinnerAfterMove(board, x, y, color) {
        if (color === 'B' && hasExactFiveAt(board, x, y, 'B')) return 'B';
        if (color === 'W' && hasFiveOrMoreAt(board, x, y, 'W')) return 'W';
        return null;
    }
    // ----------------------------------------------------

    function computeBoardState(hashString, maxMoves) {
        const board = makeEmptyBoard();
        let moveCount = 0;
        let lastX = -1;
        let lastY = -1;
        let winner = null;
        let draw = false;
        let validHash = '';

        let moves = hashString.replace(/[^a-o]/g, ''); 
        if(maxMoves !== undefined) {
            moves = moves.substring(0, maxMoves * 2);
        }

        for (let i = 0; i + 1 < moves.length; i += 2) {
            if (winner || draw) break;

            const x = chars.indexOf(moves[i]);
            const y = chars.indexOf(moves[i + 1]);

            if (!isInside(x, y) || board[y][x] !== null) break;

            const color = moveCount % 2 === 0 ? 'B' : 'W';

            if (color === 'B' && isForbiddenBlackMove(board, x, y)) break;

            moveCount++;
            board[y][x] = { color, no: moveCount };
            lastX = x;
            lastY = y;
            validHash += chars[x] + chars[y];

            winner = getWinnerAfterMove(board, x, y, color);
            draw = !winner && moveCount === size * size;
        }

        return {
            board,
            moveCount,
            lastX,
            lastY,
            winner,
            draw,
            validHash,
            gameOver: Boolean(winner || draw)
        };
    }

    function render() {
        if (!document.getElementById('grid-lines')) initBoardLayout();

        let hash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
        const state = computeBoardState(hash, currentMoveIndex);
        currentGameState = state;

        const stonesGroup = document.getElementById('stones');
        let html = '';

        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cell = state.board[y][x];
                if (cell === null) continue;

                const cx = pad + x * step;
                const cy = pad + y * step;
                const isLast = x === state.lastX && y === state.lastY;

                if (cell.color === 'B') {
                    html += `<circle cx="${cx}" cy="${cy}" r="9" fill="#111" stroke="#000" stroke-width="0.5"/>`;

                    if (showMoveNumbers) {
                        html += `<text x="${cx}" y="${cy}" fill="#fff" font-size="8.5" font-family="Arial" font-weight="bold" text-anchor="middle" dominant-baseline="central" dy="0.5">${cell.no}</text>`;
                    } else if (isLast) {
                        html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="#ef4444"/>`;
                    }
                } else {
                    html += `<circle cx="${cx}" cy="${cy}" r="9" fill="#fff" stroke="#888" stroke-width="0.8"/>`;

                    if (showMoveNumbers) {
                        html += `<text x="${cx}" y="${cy}" fill="#000" font-size="8.5" font-family="Arial" font-weight="bold" text-anchor="middle" dominant-baseline="central" dy="0.5">${cell.no}</text>`;
                    } else if (isLast) {
                        html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="#ef4444"/>`;
                    }
                }
            }
        }

        stonesGroup.innerHTML = html;
        updateStatus(state);
        document.getElementById('move-input').value = currentMoveIndex;
    }

    function updateStatus(state) {
        const indicator = document.getElementById('turn-color');
        const statusText = document.getElementById('status-text');

        statusBox.className = 'status-box';
        boardContainer.classList.toggle('game-over', state.gameOver);
        
        let modeText = isReviewMode ? "[검토중] " : "";

        if (state.winner) {
            const winnerName = state.winner === 'B' ? '흑' : '백';
            indicator.className = `turn-indicator turn-${state.winner}`;
            statusText.innerText = `${modeText}${winnerName} 승리! (총 ${state.moveCount}수)`;
            statusBox.classList.add('winner');
            return;
        }

        if (state.draw) {
            indicator.className = 'turn-indicator turn-D';
            statusText.innerText = `${modeText}무승부입니다. (총 ${state.moveCount}수)`;
            statusBox.classList.add('draw');
            return;
        }

        const nextColor = state.moveCount % 2 === 0 ? 'B' : 'W';
        indicator.className = `turn-indicator turn-${nextColor}`;
        statusText.innerText = `${modeText}${nextColor === 'B' ? '흑' : '백'}의 차례 (총 ${state.moveCount}수)`;
    }

    // 보드 클릭 이벤트
    boardContainer.addEventListener('click', function(e) {
        const ctm = svg.getScreenCTM();
        if (!ctm) return;

        const point = svg.createSVGPoint();
        point.x = e.clientX;
        point.y = e.clientY;
        const svgPoint = point.matrixTransform(ctm.inverse());

        const gridX = Math.round((svgPoint.x - pad) / step);
        const gridY = Math.round((svgPoint.y - pad) / step);

        if (!isInside(gridX, gridY)) return;

        let currentHash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
        let state = computeBoardState(currentHash, currentMoveIndex);
        
        if (state.gameOver) return;
        if (state.board[gridY][gridX] !== null) return;

        const nextColor = state.moveCount % 2 === 0 ? 'B' : 'W';
        if (nextColor === 'B' && isForbiddenBlackMove(state.board, gridX, gridY)) {
            alert('착수금지점입니다');
            return;
        }

        let moves = currentHash.substring(0, currentMoveIndex * 2);
        let nextMove = chars[gridX] + chars[gridY];
        let newHash = moves + nextMove;
        
        window.location.hash = newHash;
    });

    window.addEventListener('hashchange', () => {
        let currentHash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
        currentMoveIndex = currentHash.length / 2;
        render();
    });

    // --- 버튼 기능들 ---
    function toggleMoveNumbers() { showMoveNumbers = !showMoveNumbers; render(); }
    
    function goPrevMove() { if (currentMoveIndex > 0) { currentMoveIndex--; render(); } }
    
    function goNextMove() {
        let activeHash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
        if (currentMoveIndex < activeHash.length / 2) { currentMoveIndex++; render(); }
    }
    
    function handleInputEnter(e) { if (e.key === 'Enter') document.getElementById('move-input').blur(); }
    
    function jumpToMove() {
        let targetMove = parseInt(document.getElementById('move-input').value);
        let activeHash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
        let maxMoves = activeHash.length / 2;
        if (isNaN(targetMove) || targetMove < 0) targetMove = 0;
        if (targetMove > maxMoves) targetMove = maxMoves;
        currentMoveIndex = targetMove; render();
    }

    function toggleReviewMode() {
        let btn = document.getElementById('btn-review');
        isReviewMode = !isReviewMode;

        if (isReviewMode) {
            savedReviewState = {
                hash: window.location.hash,
                index: currentMoveIndex
            };
            btn.classList.add('active');
            btn.innerText = '🛑 검토 종료';

            let moves = window.location.hash.substring(1).replace(/[^a-o]/g, '');
            moves = moves.substring(0, currentMoveIndex * 2);
            window.location.hash = moves;
        } else {
            window.location.hash = savedReviewState.hash || '';
            currentMoveIndex = savedReviewState.index;
            savedReviewState = null;
            btn.classList.remove('active');
            btn.innerText = '🔍 검토';
        }
    }

    function captureBoard() {
        const svgElement = document.getElementById('omok-board');
        let svgString = new XMLSerializer().serializeToString(svgElement);
        if (!svgString.includes('xmlns="http://www.w3.org/2000/svg"')) {
            svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
        }

        const size = 640; 
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#e6b873'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 16; ctx.strokeRect(0, 0, size, size);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.drawImage(img, 0, 0, size, size);
            URL.revokeObjectURL(url);
            const a = document.createElement('a');
            a.download = `omok_capture_${new Date().toISOString().slice(0,10).replace(/-/g, "")}.png`;
            a.href = canvas.toDataURL('image/png');
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        img.src = url;
    }

    function copyLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert('오목 링크가 클립보드에 복사되었습니다.');
        }).catch(err => {
            console.error('복사 실패:', err);
            alert('링크 복사에 실패했습니다.');
        });
    }

    // 단축키 제어
    function pressButton(buttonId) {
        const button = document.getElementById(buttonId);
        if (!button || button.disabled) return;
        button.classList.add('keyboard-active');
        button.click();
        window.setTimeout(() => button.classList.remove('keyboard-active'), 120);
    }

    document.addEventListener('keydown', (e) => {
        const activeElement = document.activeElement;
        if (activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA')) {
            return;
        }
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        const key = e.key.toLowerCase();
        if (e.key === 'ArrowLeft' || key === 's') {
            e.preventDefault();
            pressButton('btn-prev-move');
        } else if (e.key === 'ArrowRight' || key === 'f') {
            e.preventDefault();
            pressButton('btn-next-move');
        } else if (key === 'e') {
            e.preventDefault();
            pressButton('btn-review');
        }
    });

    window.onload = () => {
        if (window.location.hash) {
            let currentHash = window.location.hash.substring(1).replace(/[^a-o]/g, '');
            currentMoveIndex = currentHash.length / 2;
        }
        render();
    };
</script>
