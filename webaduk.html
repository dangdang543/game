<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웹 바둑판</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* PC 및 Dex 화면: 가로 배치 (좌 바둑판, 우 사이드바) */
        .container { 
            background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            display: flex; flex-direction: row; align-items: flex-start; justify-content: center; 
            width: 100%; max-width: 1200px; gap: 30px;
        }
        
        /* 바둑판 영역: 화면 높이에 맞춰 최대화 */
        #board-container { 
            position: relative; aspect-ratio: 1 / 1; 
            background-color: #e6b873; border: 2px solid #b38644; box-shadow: inset 0 0 10px rgba(0,0,0,0.15); 
            cursor: pointer; border-radius: 4px; -webkit-user-select: none; user-select: none;
            flex: 1 1 auto; max-width: calc(100vh - 80px); width: 100%;
        }
        svg { width: 100%; height: 100%; display: block; }
        
        /* 우측 사이드바(상태창 및 버튼 영역) */
        .sidebar {
            flex: 0 0 320px; display: flex; flex-direction: column; gap: 15px; width: 100%;
        }

        .status-box { padding: 12px; background: #f9fafb; border-radius: 6px; font-size: 15px; font-weight: bold; color: #333; text-align: center; }
        .turn-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
        .turn-B { background: black; }
        .turn-W { background: white; border: 1px solid #ccc; }

        .controls-container { display: flex; flex-direction: column; gap: 10px; }
        .row-1, .row-2, .row-3 { display: flex; gap: 8px; width: 100%; align-items: stretch; justify-content: space-between; }
        
        button { border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; font-family: inherit; }
        button:active { transform: scale(0.96); }
        
        .row-1 > button, .row-2 > button, .row-3 > button { flex: 1; padding: 12px 4px; font-size: 13px; font-weight: bold; white-space: nowrap; letter-spacing: -0.5px; }
        
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-download { background-color: #059669; color: white; }
        .btn-upload { background-color: #d97706; color: white; } 
        .btn-upload-folder { background-color: #ea580c; color: white; } 
        .btn-info { background-color: #0284c7; color: white; }
        
        .btn-nav { background-color: #4b5563; color: white; flex: 0.8 !important; font-size: 16px !important; }
        .btn-review { background-color: #9333ea; color: white; flex: 1.5 !important; }
        .btn-capture { background-color: #be185d; color: white; flex: 1.5 !important; }
        .btn-review.active { background-color: #dc2626; animation: pulse 1.5s infinite; }

        .btn-folder-nav { background-color: #1f2937; color: white; font-size: 13px !important; flex: 1 !important; }
        
        .row-3 { display: none; } /* 폴더 로드 전에 숨김 */
        .problem-counter-box { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: bold; align-self: center; background: #f9fafb; padding: 6px 4px; border-radius: 6px; border: 1px solid #e5e7eb; color: #333; }
        #problem-number-input { width: 58px; min-width: 0; padding: 4px 2px; text-align: center; font-size: 14px; font-weight: bold; border: 1px solid #cbd5e1; border-radius: 5px; outline: none; background: white; color: #333; }
        #problem-number-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.12); }
        #problem-total { min-width: 20px; text-align: left; }

        #move-input { width: 55px; flex-shrink: 0; text-align: center; font-size: 15px; font-weight: bold; border: 2px solid #ccc; border-radius: 6px; outline: none; }
        #move-input:focus { border-color: #4f46e5; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 모바일 대응: 세로 배치로 변경 */
        @media (max-width: 800px) {
            body { padding: 0; background-color: white; align-items: flex-start; }
            .container { flex-direction: column; align-items: center; padding: 10px; border-radius: 0; box-shadow: none; gap: 15px; }
            #board-container { border-left: none; border-right: none; border-radius: 0; max-width: 100vw; flex: none; }
            .sidebar { flex: none; max-width: max(300px, calc(100vh - 220px)); }
            .row-1 > button, .row-2 > button, .row-3 > button { font-size: 11px; padding: 10px 2px; }
            .problem-counter-box { padding: 6px 2px; font-size: 12px; gap: 2px; }
            #problem-number-input { width: 46px; font-size: 12px; padding: 3px 1px; }
            #problem-total { min-width: 16px; }
            #move-input { width: 45px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="board-container">
        <svg id="baduk-board" viewBox="0 0 400 400"></svg>
    </div>

    <div class="sidebar">
        <div class="status-box">
            <span id="turn-color" class="turn-indicator turn-B"></span>
            <span id="status-text">대기 중</span>
        </div>

        <input type="file" id="sgf-file-input" accept=".sgf" style="display: none;" onchange="loadSGFFile(event)">
        <!-- 폴더 업로드용 인풋 추가 -->
        <input type="file" id="sgf-folder-input" webkitdirectory directory multiple style="display: none;" onchange="loadSGFFolder(event)">

        <div class="controls-container">
            <div class="row-1">
                <button class="btn-primary" onclick="copyLink()">🔗 링크복사</button>
                <button class="btn-download" onclick="downloadSGF()">💾 SGF저장</button>
                <button class="btn-upload" onclick="document.getElementById('sgf-file-input').click()">📂 파일열기</button>
                <button class="btn-upload-folder" onclick="document.getElementById('sgf-folder-input').click()">📁 폴더열기</button>
                <button class="btn-info" onclick="toggleMoveNumbers()">🔢 수순보기</button>
            </div>
            <div class="row-2">
                <button class="btn-nav" onclick="goPrevMove()" title="왼쪽 방향키">◀</button>
                <input type="number" id="move-input" min="0" value="0" onkeydown="handleInputEnter(event)" onblur="jumpToMove()">
                <button class="btn-nav" onclick="goNextMove()" title="오른쪽 방향키">▶</button>
                <button id="btn-review" class="btn-review" onclick="toggleReviewMode()">🔍 검토</button>
                <button class="btn-capture" onclick="captureBoard()">📸 캡쳐</button>
            </div>
            <!-- 폴더 내 문제 이동 네비게이션 -->
            <div class="row-3" id="problem-nav">
                <button class="btn-folder-nav" onclick="prevProblem()">⏮ 이전문제</button>
                <div class="problem-counter-box" id="problem-counter" title="문제 번호를 클릭해서 직접 입력할 수 있습니다.">
                    <input type="number" id="problem-number-input" min="1" value="1" onkeydown="handleProblemInputEnter(event)" onblur="jumpToProblem()">
                    <span>/</span>
                    <span id="problem-total">0</span>
                </div>
                <button class="btn-folder-nav" onclick="nextProblem()">다음문제 ⏭</button>
            </div>
        </div>
    </div>
</div>

<script>
    const size = 19;
    const chars = 'abcdefghijklmnopqrs';
    const svg = document.getElementById('baduk-board');
    const pad = 20, step = 20;

    let currentMoveIndex = 0;       
    let showMoveNumbers = false;    
    let isReviewMode = false;       
    let savedReviewState = null;    

    // 폴더 내 문제 관리 변수
    // 폴더를 열면 모든 문제의 변환된 데이터를 URL 하나에 저장합니다.
    // 현재 문제 번호는 URL에 저장하지 않으므로 문제를 바꿔도 URL은 그대로 유지됩니다.
    const FOLDER_URL_PREFIX = 'FOLDER1:';
    let folderProblems = [];
    let currentFileIndex = -1;
    let isFolderMode = false;
    let currentFolderHash = '';
    // 폴더 문제는 문제 전체(초기 배치 + 정답 수순)가 들어가는 영역을 기준으로
    // 바둑판을 자동으로 확대/크롭합니다. 문제를 검토하는 동안에는 화면이 흔들리지 않도록
    // 현재 문제를 불러올 때 계산한 viewBox를 그대로 유지합니다.
    let currentFolderViewBox = '0 0 400 400';

    function initBoardLayout() {
        let html = '';
        for(let i=0; i<size; i++) {
            let pos = pad + i * step;
            html += `<line x1="${pad}" y1="${pos}" x2="${pad + (size-1)*step}" y2="${pos}" stroke="#555" stroke-width="0.8"/>`;
            html += `<line x1="${pos}" y1="${pad}" x2="${pos}" y2="${pad + (size-1)*step}" stroke="#555" stroke-width="0.8"/>`;
        }
        const stars = [3, 9, 15];
        stars.forEach(cx => {
            stars.forEach(cy => {
                html += `<circle cx="${pad + cx * step}" cy="${pad + cy * step}" r="2.5" fill="#333"/>`;
            });
        });
        html += `<g id="stones"></g>`;
        svg.innerHTML = html;
    }

    function parseHashData(hashString) {
        let setupB = "", setupW = "", moves = "";
        if (hashString.includes('B') || hashString.includes('W') || hashString.includes('_')) {
            let parts = hashString.split('_');
            let setupPart = parts[0];
            moves = parts[1] || "";
            
            let bIdx = setupPart.indexOf('B');
            let wIdx = setupPart.indexOf('W');
            
            if (bIdx !== -1 && wIdx !== -1) {
                if (bIdx < wIdx) {
                    setupB = setupPart.substring(bIdx + 1, wIdx);
                    setupW = setupPart.substring(wIdx + 1);
                } else {
                    setupW = setupPart.substring(wIdx + 1, bIdx);
                    setupB = setupPart.substring(bIdx + 1);
                }
            } else if (bIdx !== -1) {
                setupB = setupPart.substring(bIdx + 1);
            } else if (wIdx !== -1) {
                setupW = setupPart.substring(wIdx + 1);
            }
        } else {
            moves = hashString;
        }
        return { setupB, setupW, moves };
    }

    function computeBoardState(hashString, maxMoves) {
        let board = Array(size).fill(null).map(() => Array(size).fill(null));
        let { setupB, setupW, moves } = parseHashData(hashString);
        
        if(maxMoves !== undefined) {
            moves = moves.substring(0, maxMoves * 2);
        }

        for (let i = 0; i < setupB.length; i += 2) {
            let x = chars.indexOf(setupB[i]), y = chars.indexOf(setupB[i+1]);
            if (x >= 0 && x < size && y >= 0 && y < size) board[y][x] = { color: 'B', moveNum: 0 };
        }
        for (let i = 0; i < setupW.length; i += 2) {
            let x = chars.indexOf(setupW[i]), y = chars.indexOf(setupW[i+1]);
            if (x >= 0 && x < size && y >= 0 && y < size) board[y][x] = { color: 'W', moveNum: 0 };
        }

        let moveCount = 0;
        let lastX = -1, lastY = -1;

        for (let i = 0; i < moves.length; i += 2) {
            let x = chars.indexOf(moves[i]), y = chars.indexOf(moves[i+1]);
            if (x >= 0 && x < size && y >= 0 && y < size) {
                if (board[y][x] !== null) continue;
                moveCount++;
                let color = (moveCount % 2 !== 0) ? 'B' : 'W';
                board[y][x] = { color: color, moveNum: moveCount };
                lastX = x; lastY = y;

                let opponent = color === 'B' ? 'W' : 'B';
                let dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                
                dirs.forEach(([dx, dy]) => {
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && board[ny][nx] && board[ny][nx].color === opponent) {
                        let group = [], liberties = new Set(), visited = Array(size).fill(false).map(() => Array(size).fill(false));
                        function dfs(cx, cy) {
                            visited[cy][cx] = true; group.push({x: cx, y: cy});
                            dirs.forEach(([idx, idy]) => {
                                let nnx = cx + idx, nny = cy + idy;
                                if (nnx >= 0 && nnx < size && nny >= 0 && nny < size) {
                                    if (board[nny][nnx] === null) liberties.add(`${nnx},${nny}`);
                                    else if (board[nny][nnx] && board[nny][nnx].color === opponent && !visited[nny][nnx]) dfs(nnx, nny);
                                }
                            });
                        }
                        dfs(nx, ny);
                        if (liberties.size === 0) group.forEach(p => { board[p.y][p.x] = null; });
                    }
                });
                
                let ownLiberties = new Set(), ownVisited = Array(size).fill(false).map(() => Array(size).fill(false));
                function dfsOwn(cx, cy) {
                    ownVisited[cy][cx] = true;
                    dirs.forEach(([idx, idy]) => {
                        let nnx = cx + idx, nny = cy + idy;
                        if (nnx >= 0 && nnx < size && nny >= 0 && nny < size) {
                            if (board[nny][nnx] === null) ownLiberties.add(`${nnx},${nny}`);
                            else if (board[nny][nnx] && board[nny][nnx].color === color && !ownVisited[nny][nnx]) dfsOwn(nnx, nny);
                        }
                    });
                }
                dfsOwn(x, y);
                if (ownLiberties.size === 0) { 
                    board[y][x] = null; 
                    moveCount--; 
                    if(i === moves.length - 2) { lastX = -1; lastY = -1; } 
                }
            }
        }
        return { board, moveCount, lastX, lastY };
    }

    // 현재 문제에서 돌이 등장하는 영역을 계산해 폴더 모드용 정사각형 viewBox를 만듭니다.
    //
    // 귀 문제는 돌의 위치와 관계없이 해당 귀의 1-1점이 항상 보이도록 합니다.
    // 예: 좌하귀라면 좌측/하측 경계를 1-1점(실제 바둑판 좌하단 교차점)에서
    // 조금 바깥쪽으로 잡습니다. 이렇게 하면 돌이 1-1점에 놓이지 않아도 귀가
    // 확실히 보이고, 좌측/하측의 여백도 같은 기준으로 맞춰집니다.
    // 1-1점에서 바깥쪽 여백은 1.25칸 정도로 설정했습니다.
    function getProblemViewBox(hashString) {
        const { setupB, setupW, moves } = parseHashData(hashString);
        const points = [];

        function addCoords(coordString) {
            for (let i = 0; i + 1 < coordString.length; i += 2) {
                const x = chars.indexOf(coordString[i]);
                const y = chars.indexOf(coordString[i + 1]);
                if (x >= 0 && x < size && y >= 0 && y < size) {
                    points.push({ x, y });
                }
            }
        }

        addCoords(setupB);
        addCoords(setupW);
        addCoords(moves);

        // 좌표 정보가 전혀 없으면 전체 바둑판을 보여줍니다.
        if (points.length === 0) return '0 0 400 400';

        let minX = Math.min(...points.map(p => p.x));
        let maxX = Math.max(...points.map(p => p.x));
        let minY = Math.min(...points.map(p => p.y));
        let maxY = Math.max(...points.map(p => p.y));

        // 4-4점까지를 귀 영역으로 보고, 귀에 해당하면 돌과 관계없이
        // 해당 귀의 1-1점을 반드시 포함합니다.
        // 좌상귀: (0,0), 우상귀: (18,0), 좌하귀: (0,18), 우하귀: (18,18)
        const nearLeftEdge = minX <= 3;
        const nearRightEdge = maxX >= 15;
        const nearTopEdge = minY <= 3;
        const nearBottomEdge = maxY >= 15;

        // 일반 영역은 돌 바깥으로 1칸, 귀의 1-1점은 그 점에서 바깥으로 1.25칸.
        const contentMargin = 1;
        const cornerMargin = 1.25;

        let left = nearLeftEdge
            ? pad + (0 - cornerMargin) * step
            : pad + (minX - contentMargin) * step;
        let right = nearRightEdge
            ? pad + (18 + cornerMargin) * step
            : pad + (maxX + contentMargin) * step;
        let top = nearTopEdge
            ? pad + (0 - cornerMargin) * step
            : pad + (minY - contentMargin) * step;
        let bottom = nearBottomEdge
            ? pad + (18 + cornerMargin) * step
            : pad + (maxY + contentMargin) * step;

        // 정사각형 viewBox를 만들되, 귀 영역의 경우에는 해당 귀 방향의
        // 경계(left/right/top/bottom)를 고정하여 1-1점 기준 여백이 유지되게 합니다.
        let width = right - left;
        let height = bottom - top;
        let side = Math.max(width, height);

        if (nearLeftEdge) {
            right = left + side;
        } else if (nearRightEdge) {
            left = right - side;
        } else {
            const centerX = (left + right) / 2;
            left = centerX - side / 2;
            right = centerX + side / 2;
        }

        if (nearTopEdge) {
            bottom = top + side;
        } else if (nearBottomEdge) {
            top = bottom - side;
        } else {
            const centerY = (top + bottom) / 2;
            top = centerY - side / 2;
            bottom = centerY + side / 2;
        }

        // 최종 영역은 좌표계 밖으로도 약간 나갈 수 있습니다.
        // #board-container 자체의 배경이 바둑판 색이므로, 이렇게 해야
        // 1-1점 바깥쪽에 '조금 더' 여유가 실제 화면에 표시됩니다.
        const finalSide = Math.max(right - left, bottom - top);
        if (finalSide <= 0) return '0 0 400 400';

        return `${left} ${top} ${finalSide} ${finalSide}`;
    }

    // 폴더 모드에서는 해당 문제 영역만 크게 표시하고,
    // 단일 SGF 모드에서는 기존처럼 19x19 전체 바둑판을 표시합니다.
    function applyBoardViewBox() {
        svg.setAttribute('viewBox', isFolderMode ? currentFolderViewBox : '0 0 400 400');
    }

    function render() {
        let hash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        applyBoardViewBox();
        let { board, moveCount, lastX, lastY } = computeBoardState(hash, currentMoveIndex);
        let stonesGroup = document.getElementById('stones');
        let html = '';
        
        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                if (board[y][x] !== null) {
                    let stone = board[y][x];
                    let cx = pad + x * step, cy = pad + y * step;
                    let isLast = (x === lastX && y === lastY);
                    
                    if (stone.color === 'B') {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="#111" stroke="#000" stroke-width="0.5"/>`;
                    } else {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="#fff" stroke="#999" stroke-width="0.8"/>`;
                    }

                    if (showMoveNumbers && stone.moveNum > 0) {
                        let textColor = stone.color === 'B' ? 'white' : 'black';
                        let fontSize = stone.moveNum >= 100 ? 9 : 10;
                        html += `<text x="${cx}" y="${cy}" fill="${textColor}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif">${stone.moveNum}</text>`;
                    } else if (isLast && !showMoveNumbers) {
                        let markerColor = stone.color === 'B' ? 'white' : 'black';
                        html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${markerColor}"/>`;
                    }
                }
            }
        }
        stonesGroup.innerHTML = html;
        
        let nextColor = (moveCount % 2 === 0) ? 'B' : 'W';
        document.getElementById('turn-color').className = `turn-indicator turn-${nextColor}`;
        let modeText = isReviewMode ? "[검토중] " : "";
        document.getElementById('status-text').innerText = `${modeText}${nextColor === 'B' ? '흑' : '백'}의 차례 (현재 ${moveCount}수)`;
        document.getElementById('move-input').value = moveCount;
    }

    document.getElementById('board-container').addEventListener('click', function(e) {
        // 폴더 모드이면서 검토 모드가 아닐 때: 화면 좌/우 터치로 정답 진행 및 역진행 처리
        if (isFolderMode && !isReviewMode) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            // 클릭한 X좌표가 전체 너비의 절반보다 크면 오른쪽, 작으면 왼쪽
            if (clickX > rect.width / 2) {
                goNextMove();
            } else {
                goPrevMove();
            }
            return; // 검토 모드가 아니므로 아래 착점 로직은 생략합니다.
        }

        // viewBox가 폴더 모드에서 자동으로 크롭되므로,
        // 화면 좌표를 SVG 실제 좌표로 변환해서 착점 위치를 계산합니다.
        const ctm = svg.getScreenCTM();
        if (!ctm) return;

        const point = svg.createSVGPoint();
        point.x = e.clientX;
        point.y = e.clientY;
        const svgPoint = point.matrixTransform(ctm.inverse());

        let gridX = Math.round((svgPoint.x - pad) / step);
        let gridY = Math.round((svgPoint.y - pad) / step);

        if (gridX >= 0 && gridX < size && gridY >= 0 && gridY < size) {
            let currentHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
            
            let { board } = computeBoardState(currentHash, currentMoveIndex);
            if (board[gridY][gridX] !== null) {
                return; 
            }
            
            let { setupB, setupW, moves } = parseHashData(currentHash);
            
            moves = moves.substring(0, currentMoveIndex * 2);
            let nextMove = chars[gridX] + chars[gridY];
            let newMoves = moves + nextMove;
            
            let newHash = "";
            if (setupB || setupW) {
                if (setupB) newHash += "B" + setupB;
                if (setupW) newHash += "W" + setupW;
                newHash += "_" + newMoves;
            } else {
                newHash = newMoves;
            }
            if (isFolderMode) {
                // 폴더 모드에서는 검토 중일 때만 착점합니다.
                // URL의 폴더 전체 데이터와 원본 문제 데이터는 그대로 두고,
                // 현재 검토용 상태(currentFolderHash)만 변경합니다.
                currentFolderHash = newHash;
                currentMoveIndex = newMoves.length / 2;
                render();
            } else {
                window.location.hash = newHash;
            }
        }
    });

    window.addEventListener('hashchange', () => {
        if (loadFolderFromUrl()) {
            render();
            return;
        }

        isFolderMode = false;
        folderProblems = [];
        currentFileIndex = -1;
        currentFolderHash = '';
        currentFolderViewBox = '0 0 400 400';
        document.getElementById('problem-nav').style.display = 'none';

        let currentHash = window.location.hash.substring(1);
        let { moves } = parseHashData(currentHash);

        if (window.isSgfFileLoading) {
            if (window.loadedSgfIsProblem) {
                currentMoveIndex = 0;
            } else {
                currentMoveIndex = moves.length / 2;
            }
            window.isSgfFileLoading = false;
        } else {
            currentMoveIndex = moves.length / 2;
        }
        render();
    });

    function toggleMoveNumbers() { showMoveNumbers = !showMoveNumbers; render(); }
    function goPrevMove() { if (currentMoveIndex > 0) { currentMoveIndex--; render(); } }
    function goNextMove() {
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { moves } = parseHashData(activeHash);
        if (currentMoveIndex < moves.length / 2) { currentMoveIndex++; render(); }
    }
    function handleInputEnter(e) { if (e.key === 'Enter') document.getElementById('move-input').blur(); }
    function jumpToMove() {
        let targetMove = parseInt(document.getElementById('move-input').value);
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { moves } = parseHashData(activeHash);
        let maxMoves = moves.length / 2;
        if (isNaN(targetMove) || targetMove < 0) targetMove = 0;
        if (targetMove > maxMoves) targetMove = maxMoves;
        currentMoveIndex = targetMove; render();
    }

    function toggleReviewMode() {
        let btn = document.getElementById('btn-review');
        isReviewMode = !isReviewMode;

        if (isReviewMode) {
            savedReviewState = {
                hash: isFolderMode ? currentFolderHash : window.location.hash,
                index: currentMoveIndex,
                folderProblemHash: isFolderMode && folderProblems[currentFileIndex]
                    ? folderProblems[currentFileIndex].hash
                    : null
            };
            btn.classList.add('active');
            btn.innerText = '🛑 검토 종료';

            let { setupB, setupW, moves } = parseHashData(isFolderMode ? currentFolderHash : window.location.hash.substring(1));
            moves = moves.substring(0, currentMoveIndex * 2);
            let newHash = "";
            if(setupB) newHash += "B" + setupB;
            if(setupW) newHash += "W" + setupW;
            if(setupB || setupW) newHash += "_" + moves; else newHash = moves;

            if (isFolderMode) {
                currentFolderHash = newHash;
                // URL은 폴더 전체 데이터를 유지해야 하므로 변경하지 않습니다.
                // 검토 시작 지점은 현재 수순 수와 일치하도록 유지합니다.
                currentMoveIndex = moves.length / 2;
                render();
            } else {
                window.location.hash = newHash;
            }
        } else {
            if (isFolderMode) {
                currentFolderHash = savedReviewState.hash;
                currentMoveIndex = savedReviewState.index;
                if (folderProblems[currentFileIndex] && savedReviewState.folderProblemHash !== null) {
                    folderProblems[currentFileIndex].hash = savedReviewState.folderProblemHash;
                }
                render();
            } else {
                window.location.hash = savedReviewState.hash || '';
                currentMoveIndex = savedReviewState.index;
            }
            savedReviewState = null;
            btn.classList.remove('active');
            btn.innerText = '🔍 검토';
        }
    }

    // 키보드 단축키 추가 (이전/다음문제 PageUp/PageDown 포함)
    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') goPrevMove();
        if (e.key === 'ArrowRight') goNextMove();
        if (isFolderMode) {
            if (e.key === 'PageDown') {
                e.preventDefault(); // 스크롤 방지
                nextProblem();
            }
            if (e.key === 'PageUp') {
                e.preventDefault(); // 스크롤 방지
                prevProblem();
            }
        }
    });

    function captureBoard() {
        const svgElement = document.getElementById('baduk-board');
        let svgString = new XMLSerializer().serializeToString(svgElement);
        if (!svgString.includes('xmlns="http://www.w3.org/2000/svg"')) svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');

        const size = 800; 
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#e6b873'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#b38644'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, size, size);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.drawImage(img, 0, 0, size, size);
            URL.revokeObjectURL(url);
            const a = document.createElement('a');
            a.download = `baduk_capture_${new Date().toISOString().slice(0,10).replace(/-/g, "")}.png`;
            a.href = canvas.toDataURL('image/png');
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        img.src = url;
    }

    // 공통 SGF 데이터 처리 로직 추출
    function processSgfContent(content, applyToUrl = true) {
        let problem_node = content;
        let remainder = "";
        let nodeStart = content.indexOf('(;');
        if (nodeStart !== -1) {
            let insideBracket = false, escapeNext = false;
            for(let i = nodeStart + 2; i < content.length; i++) {
                let char = content[i];
                if(escapeNext) { escapeNext = false; continue; }
                if(char === '\\') { escapeNext = true; continue; }
                if(char === '[') insideBracket = true;
                else if(char === ']') insideBracket = false;
                else if(!insideBracket) {
                    if(char === ';' || char === '(') {
                        problem_node = content.substring(0, i).trim();
                        if(!problem_node.endsWith(')')) problem_node += ')';
                        remainder = content.substring(i);
                        if(remainder.startsWith(';')) remainder = '(' + remainder;
                        break;
                    } else if (char === ')') {
                        problem_node = content.substring(0, i+1);
                        break;
                    }
                }
            }
        }

        let isProblem = problem_node.includes('AB[') || problem_node.includes('AW[');
        let flipX = false, flipY = false, isWhiteFirst = false;

        if (isProblem) {
            let allCoords = [];
            let coordRegex = /(AB|AW|AE|B|W|TB|TW|TR|SQ|CR|MA)((?:[\s]*\[[a-zA-Z]{2}\])+)/g;
            let match;
            while((match = coordRegex.exec(content)) !== null) {
                let coords = match[2].match(/\[([a-zA-Z]{2})\]/g);
                if(coords) {
                    coords.forEach(c => {
                        let x = c.charCodeAt(1) - 97, y = c.charCodeAt(2) - 97;
                        if(x >= 0 && x < 19 && y >= 0 && y < 19) allCoords.push({x, y});
                    });
                }
            }
            if(allCoords.length > 0) {
                let avgX = allCoords.reduce((sum, c) => sum + c.x, 0) / allCoords.length;
                let avgY = allCoords.reduce((sum, c) => sum + c.y, 0) / allCoords.length;
                flipX = avgX > 9;
                flipY = avgY < 9;
            }
            let firstMoveMatch = remainder.match(/;([BW])\[/i);
            if (firstMoveMatch && firstMoveMatch[1].toUpperCase() === 'W') {
                isWhiteFirst = true;
            }
        }

        function transformStr(str) {
            let x = str.charCodeAt(0) - 97, y = str.charCodeAt(1) - 97;
            let nx = flipX ? 18 - x : x;
            let ny = flipY ? 18 - y : y;
            return String.fromCharCode(nx + 97) + String.fromCharCode(ny + 97);
        }

        let setupB_arr = [], setupW_arr = [];
        let abMatches = problem_node.match(/AB(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(abMatches) {
            abMatches.forEach(m => {
                let coords = m.match(/\[([a-zA-Z]{2})\]/g);
                if(coords) coords.forEach(c => setupB_arr.push(c.slice(1,3).toLowerCase()));
            });
        }
        let awMatches = problem_node.match(/AW(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(awMatches) {
            awMatches.forEach(m => {
                let coords = m.match(/\[([a-zA-Z]{2})\]/g);
                if(coords) coords.forEach(c => setupW_arr.push(c.slice(1,3).toLowerCase()));
            });
        }

        let finalSetupB = isWhiteFirst ? setupW_arr : setupB_arr;
        let finalSetupW = isWhiteFirst ? setupB_arr : setupW_arr;
        
        let setupB_str = finalSetupB.map(transformStr).join('');
        let setupW_str = finalSetupW.map(transformStr).join('');

        let allPaths = [], currentPath = [], stack = [], lastOp = null, i = 0;
        while (i < remainder.length) {
            let c = remainder[i];
            if (c === '(') {
                stack.push([...currentPath]); lastOp = '('; i++;
            } else if (c === ')') {
                if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);
                if (stack.length > 0) currentPath = stack.pop();
                lastOp = ')'; i++;
            } else if (c === ';') {
                let start = i; i++;
                let inBracket = false, escape = false;
                while (i < remainder.length) {
                    let ch = remainder[i];
                    if (escape) escape = false;
                    else if (ch === '\\') escape = true;
                    else if (ch === '[') inBracket = true;
                    else if (ch === ']') inBracket = false;
                    else if (!inBracket && (ch === ';' || ch === '(' || ch === ')')) break;
                    i++;
                }
                currentPath.push(remainder.substring(start, i)); lastOp = 'node';
            } else {
                i++;
            }
        }
        if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);

        let correctPaths = allPaths.filter(path => {
            if(path.length === 0) return false;
            let lastNode = path[path.length - 1];
            if(/C\[.*?correct.*?\]/i.test(lastNode) || lastNode.includes('CR[')) return true;
            if(!/[BW]\[[a-zA-Z]{2}\]/.test(lastNode) && path.length > 1) {
                let prevNode = path[path.length - 2];
                if(/C\[.*?correct.*?\]/i.test(prevNode) || prevNode.includes('CR[')) return true;
            }
            return false;
        });

        let targetPaths = correctPaths.length > 0 ? correctPaths : allPaths;
        let bestPath = targetPaths.length > 0 ? targetPaths[0] : [];

        let movesHash = "";
        bestPath.forEach(node => {
            let moveMatch = [...node.matchAll(/[BW]\[([a-zA-Z]{2})\]/gi)];
            moveMatch.forEach(m => {
                movesHash += transformStr(m[1].toLowerCase());
            });
        });

        let hasSetup = (setupB_str.length > 0 || setupW_str.length > 0);
        let newHash = "";
        if (hasSetup) {
            if (setupB_str) newHash += "B" + setupB_str;
            if (setupW_str) newHash += "W" + setupW_str;
            newHash += "_" + movesHash;
        } else {
            newHash = movesHash;
        }

        if (applyToUrl) {
            isFolderMode = false;
            window.isSgfFileLoading = true;
            window.loadedSgfIsProblem = isProblem;
            window.location.hash = newHash;
        }

        return { hash: newHash, isProblem };
    }

    // UTF-8 문자열을 URL-safe Base64로 변환
    function encodeFolderPayload(data) {
        const bytes = new TextEncoder().encode(JSON.stringify(data));
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    // URL-safe Base64를 UTF-8 문자열로 복원
    function decodeFolderPayload(encoded) {
        const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getFolderUrlHash() {
        const payload = {
            version: 1,
            files: folderProblems.map(problem => ({
                name: problem.name,
                hash: problem.hash,
                isProblem: !!problem.isProblem
            }))
        };
        return FOLDER_URL_PREFIX + encodeFolderPayload(payload);
    }

    function updateProblemCounter() {
        document.getElementById('problem-number-input').value = folderProblems.length > 0 ? currentFileIndex + 1 : 0;
        document.getElementById('problem-total').innerText = folderProblems.length;
    }

    // 단일 파일 불러오기
    function loadSGFFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        isFolderMode = false;
        folderProblems = [];
        currentFileIndex = -1;
        currentFolderHash = '';
        currentFolderViewBox = '0 0 400 400';
        document.getElementById('problem-nav').style.display = 'none';

        const reader = new FileReader();
        reader.onload = function(e) {
            processSgfContent(e.target.result, true);
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error('파일을 읽지 못했습니다.'));
            reader.readAsText(file);
        });
    }

    // 📂 폴더 불러오기 기능
    // 폴더 전체를 한 번에 읽어 각 문제의 데이터를 URL 하나에 저장합니다.
    async function loadSGFFolder(event) {
        const files = Array.from(event.target.files || [])
            .filter(file => file.name.toLowerCase().endsWith('.sgf'))
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (files.length === 0) {
            alert('폴더 내에 SGF 파일이 없습니다.');
            return;
        }

        try {
            const contents = await Promise.all(files.map(readFileAsText));
            folderProblems = contents.map((content, index) => {
                const result = processSgfContent(content, false);
                return {
                    name: files[index].name,
                    hash: result.hash,
                    isProblem: result.isProblem
                };
            });

            isFolderMode = true;
            currentFileIndex = 0;
            currentFolderHash = folderProblems[0].hash;
            currentFolderViewBox = getProblemViewBox(folderProblems[0].hash);
            currentMoveIndex = folderProblems[0].isProblem ? 0 : parseHashData(currentFolderHash).moves.length / 2;
            isReviewMode = false;
            savedReviewState = null;

            // 현재 문제 번호와 관계없이 '폴더 전체'를 나타내는 URL을 한 번만 설정합니다.
            // 이후 이전/다음 문제 이동에서는 window.location.hash를 절대 변경하지 않습니다.
            const folderHash = getFolderUrlHash();
            history.replaceState(null, '', window.location.href.split('#')[0] + '#' + folderHash);

            document.getElementById('problem-nav').style.display = 'flex';
            updateProblemCounter();
            render();
            event.target.value = '';
        } catch (error) {
            console.error(error);
            alert('폴더의 SGF 파일을 읽는 중 오류가 발생했습니다.');
        }
    }

    // 배열(폴더)에서 문제 로드
    function loadSgfFromFileList(index) {
        if (index < 0 || index >= folderProblems.length) return;

        currentFileIndex = index;
        const problem = folderProblems[index];
        currentFolderHash = problem.hash;
        currentFolderViewBox = getProblemViewBox(problem.hash);
        currentMoveIndex = problem.isProblem ? 0 : parseHashData(currentFolderHash).moves.length / 2;
        isReviewMode = false;
        savedReviewState = null;

        updateProblemCounter();
        render();
    }

    // 이전 문제 이동
    function prevProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;

        if (currentFileIndex > 0) {
            loadSgfFromFileList(currentFileIndex - 1);
        } else {
            alert("첫 번째 문제입니다.");
        }
    }

    // 다음 문제 이동
    function nextProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;

        if (currentFileIndex < folderProblems.length - 1) {
            loadSgfFromFileList(currentFileIndex + 1);
        } else {
            alert("마지막 문제입니다.");
        }
    }

    // 문제 번호 직접 입력
    function handleProblemInputEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('problem-number-input').blur();
        }
    }

    function jumpToProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;

        let target = parseInt(document.getElementById('problem-number-input').value, 10);
        if (isNaN(target)) target = currentFileIndex + 1;
        target = Math.max(1, Math.min(folderProblems.length, target));
        loadSgfFromFileList(target - 1);
    }

    // URL에 저장된 폴더 데이터를 복원
    function loadFolderFromUrl() {
        const rawHash = window.location.hash.substring(1);
        if (!rawHash.startsWith(FOLDER_URL_PREFIX)) return false;

        try {
            const payload = decodeFolderPayload(rawHash.substring(FOLDER_URL_PREFIX.length));
            if (!payload || !Array.isArray(payload.files) || payload.files.length === 0) {
                throw new Error('폴더 데이터가 비어 있습니다.');
            }

            folderProblems = payload.files
                .filter(item => item && typeof item.hash === 'string')
                .map(item => ({
                    name: item.name || '문제',
                    hash: item.hash,
                    isProblem: !!item.isProblem
                }));

            if (folderProblems.length === 0) throw new Error('유효한 문제 데이터가 없습니다.');

            isFolderMode = true;
            currentFileIndex = 0;
            currentFolderHash = folderProblems[0].hash;
            currentFolderViewBox = getProblemViewBox(folderProblems[0].hash);
            currentMoveIndex = folderProblems[0].isProblem ? 0 : parseHashData(currentFolderHash).moves.length / 2;
            isReviewMode = false;
            savedReviewState = null;

            document.getElementById('problem-nav').style.display = 'flex';
            updateProblemCounter();
            return true;
        } catch (error) {
            console.error('폴더 URL 복원 실패:', error);
            alert('폴더 URL 데이터를 불러오지 못했습니다.');
            return false;
        }
    }

    function downloadSGF() {
        let hash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        if (!hash) { alert("저장할 기보가 없습니다!"); return; }

        let { setupB, setupW, moves } = parseHashData(hash);
        let sgfContent = "(;GM[1]FF[4]SZ[19]AP[BadukWeb:3.0]DT[" + new Date().toISOString().slice(0,10) + "]";
        
        if (setupB) {
            sgfContent += "AB";
            for(let i=0; i<setupB.length; i+=2) sgfContent += `[${setupB[i]}${setupB[i+1]}]`;
        }
        if (setupW) {
            sgfContent += "AW";
            for(let i=0; i<setupW.length; i+=2) sgfContent += `[${setupW[i]}${setupW[i+1]}]`;
        }

        for (let i = 0; i < moves.length; i += 2) {
            let x = moves[i], y = moves[i+1];
            let color = (i/2 % 2 === 0) ? 'B' : 'W';
            sgfContent += `;${color}[${x}${y}]`;
        }
        sgfContent += ")";

        const blob = new Blob([sgfContent], { type: 'application/x-go-sgf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "baduk_game.sgf";
        a.click();
        URL.revokeObjectURL(url);
    }

    function copyLink() {
        const url = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => alert("🔗 링크가 복사되었습니다!"));
        } else {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert("🔗 링크가 복사되었습니다!");
        }
    }

    initBoardLayout();
    const loadedFolderFromUrl = loadFolderFromUrl();
    if (!loadedFolderFromUrl) {
        let initialHash = window.location.hash.substring(1);
        if(initialHash) {
            let { setupB, setupW, moves } = parseHashData(initialHash);
            if (setupB || setupW) currentMoveIndex = 0;
            else currentMoveIndex = moves.length / 2;
        }
    }
    render();
</script>
