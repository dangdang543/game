<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웹 바둑판</title>
    <style>
        * { box-sizing: border-box; }
        /* 배경을 검은색으로, 기본 글자색을 밝은 색으로 변경 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #000000; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* PC 및 Dex 화면: 가로 배치 (좌 바둑판, 우 사이드바) */
        .container { 
            background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(255,255,255,0.05); 
            display: flex; flex-direction: row; align-items: flex-start; justify-content: center; 
            width: 100%; max-width: 1200px; gap: 30px;
        }
        
        /* 바둑판 영역 */
        #board-container { 
            position: relative; aspect-ratio: 1 / 1; 
            background-color: #9e7646; 
            border: 5px solid #523114; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 25px rgba(0,0,0,0.3); 
            cursor: pointer; border-radius: 6px; -webkit-user-select: none; user-select: none;
            flex: 1 1 auto; max-width: calc(100vh - 80px); width: 100%;
        }
        svg { width: 100%; height: 100%; display: block; }
        
        /* 우측 사이드바 */
        .sidebar {
            flex: 0 0 320px; display: flex; flex-direction: column; gap: 15px; width: 100%;
        }

        .controls-container { display: flex; flex-direction: column; gap: 10px; }
        
        /* 줄별 배치 설정 */
        .row-top, .row-1, .row-3, .row-4 { display: flex; gap: 8px; width: 100%; align-items: stretch; justify-content: space-between; }
        
        /* 최상단 레이아웃 */
        .row-top { margin-bottom: 5px; }
        
        /* 상태창 다크 모드 적용 */
        .status-box { flex: 1.2; padding: 12px; background: #2d2d2d; border-radius: 6px; font-size: 15px; font-weight: bold; color: #f3f4f6; text-align: center; display: flex; align-items: center; justify-content: center; margin: 0; }
        .turn-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
        .turn-B { background: black; border: 1px solid #555; }
        .turn-W { background: white; border: 1px solid #ccc; }

        /* 공통 버튼 스타일 - 모두 회색톤으로 통일 */
        button { 
            border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; 
            -webkit-tap-highlight-color: transparent; font-family: inherit; 
            background-color: #6b7280; color: white;
        }
        button:active { transform: scale(0.96); }
        button.keyboard-active { transform: scale(0.96); filter: brightness(0.9); }
        button:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; opacity: 0.75; }
        button:disabled:active { transform: none; }

        /* 버튼 기본 패딩 */
        .row-1 > button, .row-4 > button { 
            flex: 1; padding: 12px 2px; font-size: 13px; font-weight: bold; white-space: nowrap; letter-spacing: -0.5px; 
        }

        /* 폴더 네비게이션 - 두께 20% 증가 */
        .row-3 > button { 
            flex: 1; padding: 15px 2px; font-size: 12px; font-weight: bold; white-space: nowrap; letter-spacing: -0.5px; 
        }

        /* 링크복사, 캡쳐 버튼 특별 스타일 (연한 회색 + 입체감) */
        .btn-light-gray {
            flex: 1; background-color: #d1d5db; color: #1f2937; box-shadow: 0 4px 0 #9ca3af; 
            font-size: 13px; font-weight: bold; letter-spacing: -0.5px; white-space: nowrap;
        }
        .btn-light-gray:active {
            box-shadow: 0 0 0 #9ca3af; transform: translateY(4px);
        }
        
        /* 검토 버튼 활성화 상태 */
        .btn-review.active { background-color: #9ca3af; color: #111827; animation: pulse 1.5s infinite; }

        .row-3, .row-4 { display: none; } /* 초기 숨김 */
        
        /* 카운터 박스 */
        .problem-counter-box { flex: 1.2; padding: 15px 2px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: bold; align-self: stretch; background: #2d2d2d; border-radius: 6px; border: 1px solid #444; color: #f3f4f6; }
        
        #problem-number-input { width: 45px; min-width: 0; padding: 4px 2px; text-align: center; font-size: 13px; font-weight: bold; border: 1px solid #555; border-radius: 5px; outline: none; background: #1f2937; color: #f3f4f6; }
        #problem-number-input:focus { border-color: #4b5563; box-shadow: 0 0 0 2px rgba(156,163,175,0.3); }
        #problem-total { min-width: 16px; text-align: left; }

        /* ================= 수순, 이전, 다음, 감상 통합 컨트롤 레이아웃 ================= */
        .row-move-control {
            display: flex; gap: 8px; width: 100%; align-items: stretch; justify-content: space-between;
        }
        .row-move-control > button {
            flex: 1; padding: 0; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .center-controls {
            display: flex; flex-direction: column; gap: 4px; width: 55px; flex-shrink: 0;
        }
        #move-input {
            width: 100%; flex: 1; text-align: center; font-size: 15px; font-weight: bold; border: 2px solid #555; border-radius: 6px; outline: none; background: #1f2937; color: #f3f4f6;
        }
        #move-input:focus { border-color: #9ca3af; }
        
        #btn-memo-toggle {
            width: 100%; padding: 6px 0; font-size: 13px; font-weight: bold; letter-spacing: -0.5px; background-color: #4b5563;
        }
        
        /* 폴더 모드일 때 감상 버튼을 숨기고 row-move-control 높이를 row-3과 맞춤 */
        .folder-mode .center-controls > #btn-memo-toggle { display: none; }
        .folder-mode .row-move-control > button { padding: 15px 2px; }
        .folder-mode #memo-container { display: none !important; }
        /* ========================================================================= */

        /* 감상 메모창 (인라인 UI) */
        #memo-container {
            width: 100%; background-color: #f9fafb; border-radius: 6px; border: 1px solid #d1d5db;
            display: none; flex-direction: column; overflow: hidden;
        }
        #memo-container.open {
            display: flex; min-height: 140px;
        }
        #memo-header {
            color: #111827; background-color: #f9fafb; display: flex; justify-content: flex-start; align-items: center;
            padding: 8px 10px; border-bottom: 1px solid #e5e7eb; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        #memo-controls { display: flex; margin-left: auto; gap: 4px; }

        /* 매우 작은 버튼들 */
        .btn-micro {
            padding: 3px 6px !important; font-size: 10px !important; background-color: #e5e7eb !important; color: #374151 !important;
            border: 1px solid #d1d5db !important; border-radius: 3px !important; min-width: auto !important; flex: none !important; letter-spacing: 0px !important;
        }
        .btn-micro:hover, .btn-micro:active { background-color: #d1d5db !important; }
        
        #memo-textarea-container { padding: 8px; flex: 1; display: flex; }
        #memo-content {
            width: 100%; flex: 1; resize: none; border: none; outline: none; font-family: inherit; font-size: 13px; color: #111827; background-color: transparent; line-height: 1.4; padding: 0;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 모바일 대응 */
        @media (max-width: 800px) {
            body { padding: 0; background-color: #000000; align-items: flex-start; }
            .container { flex-direction: column; align-items: center; padding: 10px; border-radius: 0; box-shadow: none; gap: 10px; background: transparent; }
            
            #board-container { border-left: none; border-right: none; border-radius: 0; max-width: 100vw; flex: none; width: 100%; order: 4; margin: 5px 0; }
            
            .sidebar, .controls-container { display: contents; }

            .row-top, .row-1, .row-3, .row-4, .row-move-control, #memo-container { 
                max-width: max(300px, calc(100vh - 220px)); 
                width: 100%;
            }

            .row-4 { order: 1; } 
            .row-top { order: 2; gap: 6px; margin-bottom: 0; }
            .row-1 { order: 3; }
            .row-move-control { order: 5; } /* 수순, 감상 묶음 행 */
            .row-3 { order: 6; }
            #memo-container { order: 7; }   /* 메모창 팝업 시 맨아래 */

            .btn-light-gray { font-size: 12px; }
            .status-box { padding: 10px; font-size: 13px; }

            .row-1 > button, .row-4 > button { font-size: 11px; padding: 10px 1px; }
            
            /* 모바일에서도 폴더모드 4번째 줄 두께 맞춤 */
            .row-3 > button, .problem-counter-box { font-size: 11px !important; padding: 12px 1px !important; letter-spacing: -1px; }
            .folder-mode .row-move-control > button { padding: 12px 1px; }
            
            #problem-number-input { width: 40px; font-size: 11px; padding: 2px 1px; }
            #problem-total { min-width: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="board-container">
        <svg id="baduk-board" viewBox="0 0 400 400"></svg>
    </div>

    <div class="sidebar">
        <!-- 링크복사 / 상태창(흑차례) / 캡쳐 -->
        <div class="row-top">
            <button class="btn-light-gray" onclick="copyLink()">링크복사</button>
            <div class="status-box">
                <span id="turn-color" class="turn-indicator turn-B"></span>
                <span id="status-text">대기 중</span>
            </div>
            <button class="btn-light-gray" onclick="captureBoard()">캡쳐</button>
        </div>

        <input type="file" id="sgf-file-input" accept=".sgf" style="display: none;" onchange="loadSGFFile(event)">
        <input type="file" id="sgf-folder-input" webkitdirectory directory multiple style="display: none;" onchange="loadSGFFolder(event)">

        <div class="controls-container">
            <!-- 기본 5개 메뉴 버튼 -->
            <div class="row-1">
                <button onclick="toggleMoveNumbers()">수순보기</button>
                <button onclick="downloadSGF()">SGF저장</button>
                <button onclick="document.getElementById('sgf-file-input').click()">파일열기</button>
                <button onclick="document.getElementById('sgf-folder-input').click()">폴더열기</button>
                <button id="btn-review" class="btn-review" onclick="toggleReviewMode()" title="E">검토</button>
            </div>
            
            <!-- 통합 이동 제어 (이전 / 수순+감상 / 다음) -->
            <div class="row-move-control">
                <button id="btn-prev-move" onclick="goPrevMove()" title="왼쪽 방향키 / S (항상 사용 가능)">◀</button>
                <div class="center-controls">
                    <!-- 클릭 시 지워지게 설정, 모바일 숫자 전용 키보드 표시 -->
                    <input type="number" id="move-input" inputmode="numeric" pattern="[0-9]*" min="0" value="0" 
                           onkeydown="handleInputEnter(event)" onfocus="this.value=''" onblur="jumpToMove()">
                    <button id="btn-memo-toggle" onclick="toggleMemo()">감상</button>
                </div>
                <button id="btn-next-move" onclick="goNextMove()" title="오른쪽 방향키 / F (항상 사용 가능)">▶</button>
            </div>
            
            <!-- 폴더: 네비게이션 -->
            <div class="row-3" id="problem-nav">
                <button id="btn-prev-problem" onclick="prevProblem()" title="Shift+W / Shift+PageUp">이전문제</button>
                <button id="btn-prev-scene" onclick="prevScene()" title="W / PageUp">이전장면</button>
                <div class="problem-counter-box" id="problem-counter" title="문제 번호를 클릭해서 직접 입력할 수 있습니다.">
                    <input type="text" id="problem-number-input" value="1-1" onkeydown="handleProblemInputEnter(event)" onblur="jumpToProblem()">
                    <span>/</span>
                    <span id="problem-total">0</span>
                </div>
                <button id="btn-next-scene" onclick="nextScene()" title="R / PageDown">다음장면</button>
                <button id="btn-next-problem" onclick="nextProblem()" title="Shift+R / Shift+PageDown">다음문제</button>
            </div>
            
            <!-- 폴더: 상세풀이 -->
            <div class="row-4" id="detail-nav">
                <button id="btn-detail" onclick="openDetailSolution()" disabled title="현재 SGF에 상세풀이 URL이 없습니다.">상세풀이</button>
            </div>

            <!-- 메모창 (바둑판 전체 폭) -->
            <div id="memo-container">
                <div id="memo-header" onclick="toggleMemo()">
                    <span id="memo-title">감상</span>
                    <div id="memo-controls">
                        <button class="btn-micro" onclick="clearMemo(event)">삭제</button>
                        <button class="btn-micro" onclick="closeMemo(event)">닫기</button>
                        <button class="btn-micro" onclick="saveMemo(event)">저장</button>
                    </div>
                </div>
                <div id="memo-textarea-container">
                    <textarea id="memo-content" placeholder="메모를 입력하세요..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const chars = 'abcdefghijklmnopqrs';
    const svg = document.getElementById('baduk-board');
    const pad = 20, step = 20;

    let currentMoveIndex = 0;       
    let showMoveNumbers = false;    
    let isReviewMode = false;       
    let savedReviewState = null;    

    let internalHashChange = false;

    // 폴더 내 문제 관리 변수
    const FOLDER_URL_PREFIX = 'FOLDER1:';
    let folderProblems = [];
    let currentFileIndex = -1;
    let isFolderMode = false;
    let currentFolderHash = '';
    let currentFolderViewBox = '0 0 400 400';
    let currentBoardSizeRendered = -1;

    // 감상 버튼 숨김 및 폴더 모드 디자인 처리
    function updateMemoButtonVisibility() {
        const controlsContainer = document.querySelector('.controls-container');
        if (controlsContainer) {
            if (isFolderMode) {
                controlsContainer.classList.add('folder-mode');
            } else {
                controlsContainer.classList.remove('folder-mode');
            }
        }
    }

    // 메모 관련 함수들
    function toggleMemo() {
        const container = document.getElementById('memo-container');
        if (container.classList.contains('open')) {
            closeMemo(null);
        } else {
            let currentHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
            let { memo } = parseHashData(currentHash);
            document.getElementById('memo-content').value = memo || "";
            container.classList.add('open');
            document.getElementById('memo-content').focus();
        }
    }

    function closeMemo(event) {
        if (event) event.stopPropagation();
        document.getElementById('memo-container').classList.remove('open');
    }

    function saveMemo(event) {
        if (event) event.stopPropagation();
        let newMemo = document.getElementById('memo-content').value.trim();
        
        let currentHash = window.location.hash.substring(1);
        let parsed = parseHashData(currentHash);
        
        let newHash = buildHash(parsed.setupB, parsed.setupW, parsed.moves, parsed.sz_val, currentMoveIndex, newMemo);
        
        setHashInternally(newHash); 
        closeMemo(null);
    }

    function clearMemo(event) {
        if (event) event.stopPropagation();
        document.getElementById('memo-content').value = "";
        saveMemo(null);
    }

    // 바둑판 크기에 맞는 격자선과 화점 생성
    function drawBoardGrid(bSize = 19) {
        if (currentBoardSizeRendered === bSize) return;
        currentBoardSizeRendered = bSize;

        let html = `
        <defs>
            <filter id="stone-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
            </filter>
            <radialGradient id="grad-black" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777" />
                <stop offset="30%" stop-color="#222" />
                <stop offset="100%" stop-color="#050505" />
            </radialGradient>
            <radialGradient id="grad-white" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="70%" stop-color="#e3e3e3" />
                <stop offset="100%" stop-color="#b3b3b3" />
            </radialGradient>
        </defs>
        <g id="grid-lines">`;
        
        let maxPos = pad + (bSize - 1) * step;
        for(let i = 0; i < bSize; i++) {
            let pos = pad + i * step;
            html += `<line x1="${pad}" y1="${pos}" x2="${maxPos}" y2="${pos}" stroke="#331e0b" stroke-width="0.8"/>`;
            html += `<line x1="${pos}" y1="${pad}" x2="${pos}" y2="${maxPos}" stroke="#331e0b" stroke-width="0.8"/>`;
        }
        
        let stars = [];
        if (bSize === 19) {
            stars = [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
        } else if (bSize === 13) {
            stars = [[3,3],[3,9],[9,3],[9,9],[6,6]];
        } else if (bSize === 9) {
            stars = [[2,2],[2,6],[6,2],[6,6],[4,4]];
        } else if (bSize > 7) {
            let d = bSize >= 12 ? 3 : 2;
            let mid = Math.floor(bSize / 2);
            stars = [[d,d], [d, bSize-1-d], [bSize-1-d, d], [bSize-1-d, bSize-1-d]];
            if (bSize % 2 === 1) stars.push([mid, mid]);
        }
        stars.forEach(([cx, cy]) => {
            html += `<circle cx="${pad + cx * step}" cy="${pad + cy * step}" r="2.5" fill="#221105"/>`;
        });
        html += `</g><g id="stones"></g>`;
        svg.innerHTML = html;
    }

    // 해시 파싱
    function parseHashData(hashString) {
        let setupB = "", setupW = "", moves = "";
        let s_val = -1, l_val = -1, sz_val = 19, memo = "";

        let decoded = "";
        try { decoded = decodeURIComponent(hashString); } catch(e) { decoded = hashString; }
        
        let memoIdx = decoded.indexOf(' memo=');
        let infoPart = decoded;
        
        if (memoIdx !== -1) {
            infoPart = decoded.substring(0, memoIdx);
            memo = decoded.substring(memoIdx + 6);
        } else {
            let oldMemoIdx = decoded.indexOf('memo=');
            if (oldMemoIdx !== -1) {
                let checkPart = decoded.substring(0, oldMemoIdx);
                if(checkPart.endsWith(' ') || checkPart.endsWith('\t') || checkPart === '') {
                    infoPart = checkPart;
                    memo = decoded.substring(oldMemoIdx + 5);
                }
            }
        }

        let parts = infoPart.trim().split(/\s+/);
        let baseHash = parts[0];

        for (let i = 1; i < parts.length; i++) {
            if (parts[i].startsWith('s=')) s_val = parseInt(parts[i].substring(2));
            if (parts[i].startsWith('l=')) l_val = parseInt(parts[i].substring(2));
            if (parts[i].startsWith('sz=')) sz_val = parseInt(parts[i].substring(3));
        }

        if (baseHash.includes('B') || baseHash.includes('W') || baseHash.includes('_')) {
            let p = baseHash.split('_');
            let setupPart = p[0];
            moves = p[1] || "";
            
            let bIdx = setupPart.indexOf('B');
            let wIdx = setupPart.indexOf('W');
            
            if (bIdx !== -1 && wIdx !== -1) {
                if (bIdx < wIdx) {
                    setupB = setupPart.substring(bIdx + 1, wIdx);
                    setupW = setupPart.substring(wIdx + 1);
                } else {
                    setupW = setupPart.substring(wIdx + 1, bIdx);
                    setupB = setupPart.substring(bIdx + 1);
                }
            } else if (bIdx !== -1) {
                setupB = setupPart.substring(bIdx + 1);
            } else if (wIdx !== -1) {
                setupW = setupPart.substring(wIdx + 1);
            }
        } else {
            moves = baseHash;
        }

        let startingMoveNum = 1;

        if (s_val > 0 && l_val > 0) {
            let setupCount = s_val - 1;
            if (setupCount > moves.length / 2) setupCount = moves.length / 2;
            
            for (let i = 0; i < setupCount; i++) {
                let coord = moves.substring(i * 2, i * 2 + 2);
                if (i % 2 === 0) setupB += coord;
                else setupW += coord;
            }
            
            startingMoveNum = setupCount + 1;

            let endCount = l_val;
            if (endCount > moves.length / 2) endCount = moves.length / 2;
            
            moves = moves.substring(setupCount * 2, endCount * 2);
        }

        return { setupB, setupW, moves, s_val, l_val, sz_val, startingMoveNum, memo };
    }

    // 해시 빌드
    function buildHash(setupB, setupW, moves, sz = 19, s = -1, memo = "") {
        let hash = "";
        if (setupB || setupW) {
            if (setupB) hash += "B" + setupB;
            if (setupW) hash += "W" + setupW;
            hash += "_" + moves;
        } else {
            hash = moves;
        }
        if (sz && sz !== 19) {
            hash += ` sz=${sz}`;
        }
        if (s >= 0) {
            hash += ` s=${s}`;
        }
        if (memo) {
            hash += ` memo=${encodeURIComponent(memo)}`;
        }
        return hash;
    }

    function setHashInternally(newHash) {
        internalHashChange = true;
        window.location.hash = newHash;
    }

    function computeBoardState(hashString, maxMoves, boardSize = 19) {
        let { setupB, setupW, moves, startingMoveNum, sz_val } = parseHashData(hashString); 
        let finalBoardSize = boardSize || sz_val || 19;

        let board = Array(finalBoardSize).fill(null).map(() => Array(finalBoardSize).fill(null));
        
        if(maxMoves !== undefined) {
            moves = moves.substring(0, maxMoves * 2);
        }

        for (let i = 0; i < setupB.length; i += 2) {
            let x = chars.indexOf(setupB[i]), y = chars.indexOf(setupB[i+1]);
            if (x >= 0 && x < finalBoardSize && y >= 0 && y < finalBoardSize) board[y][x] = { color: 'B', moveNum: 0 };
        }
        for (let i = 0; i < setupW.length; i += 2) {
            let x = chars.indexOf(setupW[i]), y = chars.indexOf(setupW[i+1]);
            if (x >= 0 && x < finalBoardSize && y >= 0 && y < finalBoardSize) board[y][x] = { color: 'W', moveNum: 0 };
        }

        let visualMoveNum = 0;
        let lastX = -1, lastY = -1;

        for (let i = 0; i < moves.length; i += 2) {
            let x = chars.indexOf(moves[i]), y = chars.indexOf(moves[i+1]);
            if (x >= 0 && x < finalBoardSize && y >= 0 && y < finalBoardSize) {
                if (board[y][x] !== null) continue;
                visualMoveNum++;
                
                let color = ((visualMoveNum - 1 + startingMoveNum - 1) % 2 === 0) ? 'B' : 'W';
                board[y][x] = { color: color, moveNum: visualMoveNum };
                lastX = x; lastY = y;

                let opponent = color === 'B' ? 'W' : 'B';
                let dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                
                dirs.forEach(([dx, dy]) => {
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < finalBoardSize && ny >= 0 && ny < finalBoardSize && board[ny][nx] && board[ny][nx].color === opponent) {
                        let group = [], liberties = new Set(), visited = Array(finalBoardSize).fill(false).map(() => Array(finalBoardSize).fill(false));
                        function dfs(cx, cy) {
                            visited[cy][cx] = true; group.push({x: cx, y: cy});
                            dirs.forEach(([idx, idy]) => {
                                let nnx = cx + idx, nny = cy + idy;
                                if (nnx >= 0 && nnx < finalBoardSize && nny >= 0 && nny < finalBoardSize) {
                                    if (board[nny][nnx] === null) liberties.add(`${nnx},${nny}`);
                                    else if (board[nny][nnx] && board[nny][nnx].color === opponent && !visited[nny][nnx]) dfs(nnx, nny);
                                }
                            });
                        }
                        dfs(nx, ny);
                        if (liberties.size === 0) group.forEach(p => { board[p.y][p.x] = null; });
                    }
                });
                
                let ownLiberties = new Set(), ownVisited = Array(finalBoardSize).fill(false).map(() => Array(finalBoardSize).fill(false));
                function dfsOwn(cx, cy) {
                    ownVisited[cy][cx] = true;
                    dirs.forEach(([idx, idy]) => {
                        let nnx = cx + idx, nny = cy + idy;
                        if (nnx >= 0 && nnx < finalBoardSize && nny >= 0 && nny < finalBoardSize) {
                            if (board[nny][nnx] === null) ownLiberties.add(`${nnx},${nny}`);
                            else if (board[nny][nnx] && board[nny][nnx].color === color && !ownVisited[nny][nnx]) dfsOwn(nnx, nny);
                        }
                    });
                }
                dfsOwn(x, y);
                if (ownLiberties.size === 0) { 
                    board[y][x] = null; 
                    visualMoveNum--; 
                    if(i === moves.length - 2) { lastX = -1; lastY = -1; } 
                }
            }
        }
        return { board, moveCount: visualMoveNum, lastX, lastY, startingMoveNum };
    }

    function getProblemViewBox(hashString) {
        const { setupB, setupW, moves, sz_val } = parseHashData(hashString);
        let bSize = sz_val || 19;
        const points = [];

        function addCoords(coordString) {
            for (let i = 0; i + 1 < coordString.length; i += 2) {
                const x = chars.indexOf(coordString[i]);
                const y = chars.indexOf(coordString[i + 1]);
                if (x >= 0 && x < bSize && y >= 0 && y < bSize) {
                    points.push({ x, y });
                }
            }
        }

        addCoords(setupB);
        addCoords(setupW);
        addCoords(moves);

        if (points.length === 0) {
            if (bSize !== 19) {
                const totalLength = pad * 2 + (bSize - 1) * step;
                return `0 0 ${totalLength} ${totalLength}`;
            }
            return '0 0 400 400';
        }

        let minX = Math.min(...points.map(p => p.x));
        let maxX = Math.max(...points.map(p => p.x));
        let minY = Math.min(...points.map(p => p.y));
        let maxY = Math.max(...points.map(p => p.y));

        const nearLeftEdge = minX <= 3;
        const nearRightEdge = maxX >= (bSize - 4);
        const nearTopEdge = minY <= 3;
        const nearBottomEdge = maxY >= (bSize - 4);

        const contentMargin = 1;
        const cornerMargin = 1.25;

        let left = nearLeftEdge ? pad + (0 - cornerMargin) * step : pad + (minX - contentMargin) * step;
        let right = nearRightEdge ? pad + (bSize - 1 + cornerMargin) * step : pad + (maxX + contentMargin) * step;
        let top = nearTopEdge ? pad + (0 - cornerMargin) * step : pad + (minY - contentMargin) * step;
        let bottom = nearBottomEdge ? pad + (bSize - 1 + cornerMargin) * step : pad + (maxY + contentMargin) * step;

        let width = right - left;
        let height = bottom - top;
        let side = Math.max(width, height);

        if (nearLeftEdge) right = left + side;
        else if (nearRightEdge) left = right - side;
        else {
            const centerX = (left + right) / 2;
            left = centerX - side / 2;
            right = centerX + side / 2;
        }

        if (nearTopEdge) bottom = top + side;
        else if (nearBottomEdge) top = bottom - side;
        else {
            const centerY = (top + bottom) / 2;
            top = centerY - side / 2;
            bottom = centerY + side / 2;
        }

        const finalSide = Math.max(right - left, bottom - top);
        if (finalSide <= 0) return '0 0 400 400';

        return `${left} ${top} ${finalSide} ${finalSide}`;
    }

    function getFolderProblemViewBox(problem) {
        const bSize = problem.boardSize || 19;
        if (bSize !== 19) {
            const totalLength = pad * 2 + (bSize - 1) * step;
            return `0 0 ${totalLength} ${totalLength}`;
        }
        return getProblemViewBox(problem.hash);
    }

    function applyBoardViewBox() {

                svg.setAttribute('viewBox', `0 0 ${totalLength} ${totalLength}`);

        }

    function render() {

        let hash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let parsed = parseHashData(hash);
        let bSize = activeProblem ? (activeProblem.boardSize || 19) : (parsed.sz_val || 19);

        drawBoardGrid(bSize);
        applyBoardViewBox();

        let { board, moveCount, lastX, lastY, startingMoveNum } = computeBoardState(hash, currentMoveIndex, bSize);
        let stonesGroup = document.getElementById('stones');
        let html = '';
        
        for (let y = 0; y < bSize; y++) {
            for (let x = 0; x < bSize; x++) {
                if (board[y][x] !== null) {
                    let stone = board[y][x];
                    let cx = pad + x * step, cy = pad + y * step;
                    let isLast = (x === lastX && y === lastY);
                    
                    if (stone.color === 'B') {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="url(#grad-black)" filter="url(#stone-shadow)"/>`;
                    } else {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="url(#grad-white)" filter="url(#stone-shadow)"/>`;
                    }

                    if (showMoveNumbers && stone.moveNum > 0) {
                        let textColor = stone.color === 'B' ? 'white' : 'black';
                        let fontSize = stone.moveNum >= 100 ? 9 : 10;
                        html += `<text x="${cx}" y="${cy}" fill="${textColor}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" style="text-shadow: 0px 1px 2px rgba(0,0,0,0.4);">${stone.moveNum}</text>`;
                    } else if (isLast && !showMoveNumbers) {
                        let markerColor = stone.color === 'B' ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0.7)';
                        html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${markerColor}"/>`;
                    }
                }
            }
        }
        stonesGroup.innerHTML = html;
        
        let nextColor = ((moveCount + startingMoveNum - 1) % 2 === 0) ? 'B' : 'W';
        document.getElementById('turn-color').className = `turn-indicator turn-${nextColor}`;
        let modeText = isReviewMode ? "[검토중] " : "";
        document.getElementById('status-text').innerText = `${modeText}${nextColor === 'B' ? '흑' : '백'}차례`;
        document.getElementById('move-input').value = moveCount;
    }

    document.getElementById('board-container').addEventListener('click', function(e) {
        if (isFolderMode && !isReviewMode) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                goNextMove();
            } else {
                goPrevMove();
            }
            return;
        }

        const ctm = svg.getScreenCTM();
        if (!ctm) return;

        const point = svg.createSVGPoint();
        point.x = e.clientX;
        point.y = e.clientY;
        const svgPoint = point.matrixTransform(ctm.inverse());

        let gridX = Math.round((svgPoint.x - pad) / step);
        let gridY = Math.round((svgPoint.y - pad) / step);

        let activeProblem = (isFolderMode && folderProblems[currentFileIndex]) ? folderProblems[currentFileIndex] : null;
        let currentHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let parsedHash = parseHashData(currentHash);
        let bSize = activeProblem ? (activeProblem.boardSize || 19) : (parsedHash.sz_val || 19);

        if (gridX >= 0 && gridX < bSize && gridY >= 0 && gridY < bSize) {
            let { board } = computeBoardState(currentHash, currentMoveIndex, bSize);
            if (board[gridY][gridX] !== null) return; 
            
            let { setupB, setupW, moves, memo } = parsedHash;
            
            moves = moves.substring(0, currentMoveIndex * 2);
            let nextMove = chars[gridX] + chars[gridY];
            let newMoves = moves + nextMove;
            
            let newHash = buildHash(setupB, setupW, newMoves, bSize, -1, memo);
            
            if (isFolderMode) {
                currentFolderHash = newHash;
                currentMoveIndex = newMoves.length / 2;
                render();
            } else {
                currentMoveIndex = newMoves.length / 2;
                setHashInternally(newHash);
            }
        }
    });

    function goNextMove() {
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);

    function jumpToMove() {
        let targetMove = parseInt(document.getElementById('move-input').value);
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { moves } = parseHashData(activeHash);
        let maxMoves = moves.length / 2;
        
        if (isNaN(targetMove) || targetMove < 0) {
            document.getElementById('move-input').value = currentMoveIndex; 
            return;
        }
        if (targetMove > maxMoves) targetMove = maxMoves;
        currentMoveIndex = targetMove; render();

                hash: isFolderMode ? currentFolderHash : window.location.hash.substring(1),

            activeElement.isContentEditable
        )) {

            else pressButton('btn-prev-scene');
        } else if (e.key === 'PageDown' || key === 'r') {

    function captureBoard() {
        const svgElement = document.getElementById('baduk-board');
        let svgString = new XMLSerializer().serializeToString(svgElement);
        if (!svgString.includes('xmlns="http://www.w3.org/2000/svg"')) svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');

        const size = 800; 
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#9e7646'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#523114'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, size, size);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.drawImage(img, 0, 0, size, size);
            URL.revokeObjectURL(url);
            const a = document.createElement('a');
            a.download = `baduk_capture_${new Date().toISOString().slice(0,10).replace(/-/g, "")}.png`;
            a.href = canvas.toDataURL('image/png');
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        img.src = url;

    function extractDetailUrl(content) {
        if (typeof content !== 'string' || !content) return '';

        const problemMatch = content.match(/101weiqi\s+problem\s+(\d+)/i);
        if (problemMatch && problemMatch[1]) return `https://www.101weiqi.com/q/${problemMatch[1]}/`;

        const normalized = content.replace(/\\\r?\n/g, '').replace(/\\:/g, ':').replace(/\\\//g, '/');

        const urlMatches = normalized.match(/https?:\/\/[^\s\]\[<>"']+/gi);
        if (urlMatches && urlMatches.length > 0) return urlMatches[0].replace(/[.,;!?]+$/, ''); 

        return '';
    }

    function processSgfContent(content, applyToUrl = true, fileNameIndex = 1) {
        let boardSize = 19;
        let szMatch = content.match(/SZ\[(\d+)\]/i);
        if (szMatch) boardSize = parseInt(szMatch[1], 10);

        let problem_node = content;
        let remainder = "";
        let nodeStart = content.indexOf('(;');
        if (nodeStart !== -1) {
            let insideBracket = false, escapeNext = false;
            for(let i = nodeStart + 2; i < content.length; i++) {
                let char = content[i];
                if(escapeNext) { escapeNext = false; continue; }
                if(char === '\\') { escapeNext = true; continue; }
                if(char === '[') insideBracket = true;
                else if(char === ']') insideBracket = false;
                else if(!insideBracket) {
                    if(char === ';' || char === '(') {
                        problem_node = content.substring(0, i).trim();
                        if(!problem_node.endsWith(')')) problem_node += ')';
                        remainder = content.substring(i);
                        if(remainder.startsWith(';')) remainder = '(' + remainder;
                        break;
                    } else if (char === ')') {
                        problem_node = content.substring(0, i+1);
                        break;
                    }
                }
            }
        }

        let isProblem = problem_node.includes('AB[') || problem_node.includes('AW[');
        let flipX = false, flipY = false, isWhiteFirst = false;

        if (isProblem && !applyToUrl) {
            let allCoords = [];
            let coordRegex = /(AB|AW|AE|B|W|TB|TW|TR|SQ|CR|MA)((?:[\s]*\[[a-zA-Z]{2}\])+)/g;
            let match;
            while((match = coordRegex.exec(content)) !== null) {
                let coords = match[2].match(/\[([a-zA-Z]{2})\]/g);
                if(coords) {
                    coords.forEach(c => {
                        let x = c.charCodeAt(1) - 97, y = c.charCodeAt(2) - 97;
                        if(x >= 0 && x < boardSize && y >= 0 && y < boardSize) allCoords.push({x, y});
                    });
                }
            }
            if(allCoords.length > 0) {
                let minX = Math.min(...allCoords.map(p => p.x));
                let maxX = Math.max(...allCoords.map(p => p.x));
                let minY = Math.min(...allCoords.map(p => p.y));
                let maxY = Math.max(...allCoords.map(p => p.y));

                let nearLeftEdge = minX <= 3, nearRightEdge = maxX >= (boardSize - 4);
                let nearTopEdge = minY <= 3, nearBottomEdge = maxY >= (boardSize - 4);
                let isFullBoard = (nearLeftEdge && nearRightEdge) || (nearTopEdge && nearBottomEdge) || ((maxX - minX >= boardSize - 6) && (maxY - minY >= boardSize - 6));

                if (!isFullBoard) {
                    let avgX = allCoords.reduce((sum, c) => sum + c.x, 0) / allCoords.length;
                    let avgY = allCoords.reduce((sum, c) => sum + c.y, 0) / allCoords.length;
                    flipX = avgX > (boardSize / 2 - 0.5); flipY = avgY < (boardSize / 2 - 0.5);
                }
            }
            let firstMoveMatch = remainder.match(/;([BW])\[/i);
            if (firstMoveMatch && firstMoveMatch[1].toUpperCase() === 'W') isWhiteFirst = true;
        }

        function transformStr(str) {
            let x = str.charCodeAt(0) - 97, y = str.charCodeAt(1) - 97;
            let nx = flipX ? (boardSize - 1) - x : x;
            let ny = flipY ? (boardSize - 1) - y : y;
            return String.fromCharCode(nx + 97) + String.fromCharCode(ny + 97);
        }

        let setupB_arr = [], setupW_arr = [];
        let abMatches = problem_node.match(/AB(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(abMatches) abMatches.forEach(m => { let coords = m.match(/\[([a-zA-Z]{2})\]/g); if(coords) coords.forEach(c => setupB_arr.push(c.slice(1,3).toLowerCase())); });
        let awMatches = problem_node.match(/AW(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(awMatches) awMatches.forEach(m => { let coords = m.match(/\[([a-zA-Z]{2})\]/g); if(coords) coords.forEach(c => setupW_arr.push(c.slice(1,3).toLowerCase())); });

        let finalSetupB = isWhiteFirst ? setupW_arr : setupB_arr;
        let finalSetupW = isWhiteFirst ? setupB_arr : setupW_arr;
        
        let setupB_str = finalSetupB.map(transformStr).join('');
        let setupW_str = finalSetupW.map(transformStr).join('');

        let allPaths = [], currentPath = [], stack = [], lastOp = null, i = 0;
        while (i < remainder.length) {
            let c = remainder[i];
            if (c === '(') { stack.push([...currentPath]); lastOp = '('; i++; } 
            else if (c === ')') {
                if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);
                if (stack.length > 0) currentPath = stack.pop();
                lastOp = ')'; i++;
            } else if (c === ';') {
                let start = i; i++;
                let inBracket = false, escape = false;
                while (i < remainder.length) {
                    let ch = remainder[i];
                    if (escape) escape = false;
                    else if (ch === '\\') escape = true;
                    else if (ch === '[') inBracket = true;
                    else if (ch === ']') inBracket = false;
                    else if (!inBracket && (ch === ';' || ch === '(' || ch === ')')) break;
                    i++;
                }
                currentPath.push(remainder.substring(start, i)); lastOp = 'node';
            } else i++;
        }
        if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);
        if (allPaths.length === 0) allPaths.push([]); 

        let branchesInfo = allPaths.map((path, idx) => {
            let movesHash = "";
            path.forEach(node => {
                let moveMatch = [...node.matchAll(/[BW]\[([a-zA-Z]{2})\]/gi)];
                moveMatch.forEach(m => { movesHash += transformStr(m[1].toLowerCase()); });
            });
            let newHash = buildHash(setupB_str, setupW_str, movesHash, boardSize);
            return { hash: newHash, isProblem: isProblem, boardSize: boardSize, branchLabel: `${fileNameIndex}-${idx + 1}` };
        });

        let correctPaths = allPaths.filter(path => {
            if(path.length === 0) return false;
            let lastNode = path[path.length - 1];
            if(/C\[.*?correct.*?\]/i.test(lastNode) || lastNode.includes('CR[')) return true;
            if(!/[BW]\[[a-zA-Z]{2}\]/.test(lastNode) && path.length > 1) {
                let prevNode = path[path.length - 2];
                if(/C\[.*?correct.*?\]/i.test(prevNode) || prevNode.includes('CR[')) return true;
            }
            return false;
        });

        let targetPaths = correctPaths.length > 0 ? correctPaths : allPaths;
        let bestPath = targetPaths.length > 0 ? targetPaths[0] : [];

        let bestMovesHash = "";
        bestPath.forEach(node => {
            let moveMatch = [...node.matchAll(/[BW]\[([a-zA-Z]{2})\]/gi)];
            moveMatch.forEach(m => { bestMovesHash += transformStr(m[1].toLowerCase()); });
        });

        let bestHash = buildHash(setupB_str, setupW_str, bestMovesHash, boardSize);

        if (applyToUrl) {
            isFolderMode = false;
            window.isSgfFileLoading = true;
            window.loadedSgfIsProblem = isProblem;
            window.location.hash = bestHash;
        }

        return { hash: bestHash, isProblem: isProblem, boardSize: boardSize, branches: branchesInfo };
    }

    function encodeFolderPayload(data) {
        const bytes = new TextEncoder().encode(JSON.stringify(data));
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function decodeFolderPayload(encoded) {
        const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getFolderUrlHash() {
        const payload = {
            version: 1,
            files: folderProblems.map(problem => ({
                name: problem.name, hash: problem.hash, isProblem: !!problem.isProblem, boardSize: problem.boardSize || 19, detailUrl: problem.detailUrl || '', branchLabel: problem.branchLabel || ''
            }))
        };
        return FOLDER_URL_PREFIX + encodeFolderPayload(payload);
    }

    function updateProblemCounter() {
        let totalProblems = 0;
        if (folderProblems.length > 0) {
            let uniqueProblems = new Set();
            folderProblems.forEach((p, idx) => {
                if (p.branchLabel && p.branchLabel.includes('-')) uniqueProblems.add(p.branchLabel.split('-')[0]);
                else uniqueProblems.add(p.branchLabel || `unknown_${idx}`);
            });
            totalProblems = uniqueProblems.size;
            if (folderProblems[currentFileIndex]) document.getElementById('problem-number-input').value = folderProblems[currentFileIndex].branchLabel || (currentFileIndex + 1);
        } else {
            document.getElementById('problem-number-input').value = "0";
        }
        document.getElementById('problem-total').innerText = totalProblems;
        updateDetailButton();
    }

    function prevScene() {
        if (!isFolderMode || folderProblems.length === 0) return;
        if (currentFileIndex > 0) loadSgfFromFileList(currentFileIndex - 1);
        else alert("첫 번째 장면입니다.");
    }

    function nextScene() {
        if (!isFolderMode || folderProblems.length === 0) return;
        if (currentFileIndex < folderProblems.length - 1) loadSgfFromFileList(currentFileIndex + 1);
        else alert("마지막 장면입니다.");
    }

    function getFileNum(branchLabel) {
        if (!branchLabel) return 1;
        let parts = branchLabel.split('-'); return parseInt(parts[0], 10);
    }

    function prevProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;
        let currentFileNum = getFileNum(folderProblems[currentFileIndex].branchLabel);
        let targetFileNum = currentFileNum - 1;

        if (targetFileNum > 0) {
            let targetIndex = folderProblems.findIndex(p => getFileNum(p.branchLabel) === targetFileNum);
            if (targetIndex !== -1) { loadSgfFromFileList(targetIndex); return; }
        }
        alert("첫 번째 문제입니다.");
    }

    function nextProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;
        let currentFileNum = getFileNum(folderProblems[currentFileIndex].branchLabel);
        let targetFileNum = currentFileNum + 1;

        let targetIndex = folderProblems.findIndex(p => getFileNum(p.branchLabel) === targetFileNum);
        if (targetIndex !== -1) loadSgfFromFileList(targetIndex);
        else alert("마지막 문제입니다.");
    }

    function handleProblemInputEnter(e) { if (e.key === 'Enter') document.getElementById('problem-number-input').blur(); }

    function jumpToProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;

        let targetValue = document.getElementById('problem-number-input').value.trim();
        if (/^\d+$/.test(targetValue)) targetValue += "-1";

        let foundIndex = folderProblems.findIndex(p => p.branchLabel === targetValue);
        
        if (foundIndex !== -1) {
            loadSgfFromFileList(foundIndex);
        } else {
            let targetNum = parseInt(targetValue, 10);
            if (!isNaN(targetNum)) {
                let target = Math.max(1, Math.min(folderProblems.length, targetNum));
                loadSgfFromFileList(target - 1);
            } else {
                updateProblemCounter();
            }
        }
    }

    function loadSgfFromFileList(index) {
        if (index < 0 || index >= folderProblems.length) return;
        currentFileIndex = index;
        const problem = folderProblems[currentFileIndex];
        currentFolderHash = problem.hash;
        currentFolderViewBox = getFolderProblemViewBox(problem);
        
        let { moves } = parseHashData(currentFolderHash);
        
        if (problem.isProblem) currentMoveIndex = 0;
        else currentMoveIndex = moves.length / 2;
        
        isReviewMode = false;
        let btnReview = document.getElementById('btn-review');
        btnReview.classList.remove('active'); btnReview.innerText = '검토';
        savedReviewState = null;

        updateProblemCounter();
        
        const newUrlHash = getFolderUrlHash();
        history.replaceState(null, null, '#' + newUrlHash);
        
        render();
    }

    function loadFolderFromUrl() {
        const hash = window.location.hash.substring(1);
        if (hash.startsWith(FOLDER_URL_PREFIX)) {
            try {
                const encoded = hash.substring(FOLDER_URL_PREFIX.length);
                const payload = decodeFolderPayload(encoded);
                
                if (payload.version === 1 && Array.isArray(payload.files)) {
                    folderProblems = payload.files;
                    isFolderMode = true;
                    document.getElementById('problem-nav').style.display = 'flex';
                    document.getElementById('detail-nav').style.display = 'flex';
                    updateMemoButtonVisibility();
                    loadSgfFromFileList(0);
                    return true;
                }
            } catch (e) {
                console.error("폴더 URL 파싱 실패:", e); isFolderMode = false;
            }
        }
        return false;
    }

    function loadSGFFolder(event) {
        const files = Array.from(event.target.files).filter(file => file.name.toLowerCase().endsWith('.sgf'));
        if (files.length === 0) { alert("선택된 폴더에 SGF 파일이 없습니다."); return; }
        
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        folderProblems = [];
        let filesProcessed = 0;
        let totalFiles = files.length;
        let fileContents = new Array(totalFiles);

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                fileContents[index] = e.target.result;
                filesProcessed++;
                if (filesProcessed === totalFiles) processAllFiles(fileContents);
            };
            reader.readAsText(file);
        });
        event.target.value = '';
    }

    function processAllFiles(contents) {
        folderProblems = [];
        contents.forEach((content, index) => {
            const fileIndex = index + 1;
            const detailUrl = extractDetailUrl(content);
            const result = processSgfContent(content, false, fileIndex);
            
            result.branches.forEach(branch => {
                folderProblems.push({
                    name: `file_${fileIndex}_${branch.branchLabel}`, hash: branch.hash, isProblem: branch.isProblem, boardSize: branch.boardSize, detailUrl: detailUrl, branchLabel: branch.branchLabel
                });
            });
        });

        if (folderProblems.length > 0) {
            isFolderMode = true;
            document.getElementById('problem-nav').style.display = 'flex';
            document.getElementById('detail-nav').style.display = 'flex';
            updateMemoButtonVisibility();
            const newUrlHash = getFolderUrlHash();
            history.pushState(null, null, '#' + newUrlHash);
            loadSgfFromFileList(0);
        } else {
            alert("유효한 SGF 기보를 찾을 수 없습니다.");
        }
    }

    function loadSGFFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            processSgfContent(content, true);
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    function copyLink() {
        const url = window.location.href;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(() => { alert('링크가 클립보드에 복사되었습니다.'); }).catch(() => { fallbackCopyLink(url); });
        } else {
            fallbackCopyLink(url);
        }
    }

    function fallbackCopyLink(text) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed'; textArea.style.top = '0'; textArea.style.left = '0'; textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.focus(); textArea.select();
        try {
            const successful = document.execCommand('copy');
            if (successful) alert('링크가 클립보드에 복사되었습니다.');
            else alert('링크 복사에 실패했습니다.');
        } catch (err) { alert('링크 복사에 실패했습니다.'); } 
        finally { document.body.removeChild(textArea); }
    }

    function downloadSGF() {
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { setupB, setupW, moves, startingMoveNum, sz_val } = parseHashData(activeHash);
        
        let bSize = (isFolderMode && folderProblems[currentFileIndex]) ? (folderProblems[currentFileIndex].boardSize || 19) : (sz_val || 19);
        let sgfContent = `(;GM[1]FF[4]SZ[${bSize}]`;

        if (setupB.length > 0) {
            sgfContent += "AB";
            for (let i = 0; i < setupB.length; i += 2) sgfContent += `[${setupB.slice(i, i+2)}]`;
        }
        if (setupW.length > 0) {
            sgfContent += "AW";
            for (let i = 0; i < setupW.length; i += 2) sgfContent += `[${setupW.slice(i, i+2)}]`;
        }
        if (startingMoveNum % 2 === 0) sgfContent += "PL[W]";
        
        for (let i = 0; i < moves.length; i += 2) {
            let color = ((i / 2 + startingMoveNum - 1) % 2 === 0) ? 'B' : 'W';
            sgfContent += `;${color}[${moves.slice(i, i+2)}]`;
        }
        sgfContent += ")";
        
        const blob = new Blob([sgfContent], { type: 'application/x-go-sgf' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        let timestamp = new Date().toISOString().slice(0,19).replace(/[:-]/g, "").replace("T", "_");
        a.download = `baduk_${timestamp}.sgf`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    window.onload = () => {
        if (!loadFolderFromUrl()) {
            isFolderMode = false;
            updateMemoButtonVisibility();
            if (window.location.hash) {
                let currentHash = window.location.hash.substring(1);
                let { moves, s_val, l_val, memo } = parseHashData(currentHash);
                
                if (s_val > 0 && l_val > 0) {
                    currentMoveIndex = 0; 
                } else if (s_val >= 0) { // 수순 0일 때 저장 및 로딩 대응
                    currentMoveIndex = s_val;
                    if (currentMoveIndex > moves.length / 2) currentMoveIndex = moves.length / 2;
                } else {
                    currentMoveIndex = moves.length / 2;
                }
                render();

                if (memo) {
                    let container = document.getElementById('memo-container');
                    if (container) {
                        document.getElementById('memo-content').value = memo;
                        container.classList.add('open');
                    }
                }
            } else {
                render();
            }
        } else {
            updateMemoButtonVisibility();
        }
    };
</script>
