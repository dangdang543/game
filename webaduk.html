<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>웹 바둑판</title>
    <style>
        * { box-sizing: border-box; }
        /* 배경을 검은색으로, 기본 글자색을 밝은 색으로 변경 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #000000; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* PC 및 Dex 화면: 가로 배치 (좌 바둑판, 우 사이드바) */
        .container { 
            background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(255,255,255,0.05); 
            display: flex; flex-direction: row; align-items: flex-start; justify-content: center; 
            width: 100%; max-width: 1200px; gap: 30px;
        }
        
        /* 바둑판 영역: 눈이 편안한 톤다운 단색 배경 적용 */
        #board-container { 
            position: relative; aspect-ratio: 1 / 1; 
            background-color: #9e7646; /* 균일하고 톤다운된 나무색상 */
            border: 5px solid #523114; /* 실제 바둑판 테두리 같은 짙은 나무색 */
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 25px rgba(0,0,0,0.3); /* 깊이감 있는 외부/내부 그림자 */
            cursor: pointer; border-radius: 6px; -webkit-user-select: none; user-select: none;
            flex: 1 1 auto; max-width: calc(100vh - 80px); width: 100%;
        }
        svg { width: 100%; height: 100%; display: block; }
        
        /* 우측 사이드바(상태창 및 버튼 영역) */
        .sidebar {
            flex: 0 0 320px; display: flex; flex-direction: column; gap: 15px; width: 100%;
        }

        /* 상태창 다크 모드 적용 */
        .status-box { padding: 12px; background: #2d2d2d; border-radius: 6px; font-size: 15px; font-weight: bold; color: #f3f4f6; text-align: center; }
        .turn-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
        .turn-B { background: black; border: 1px solid #555; }
        .turn-W { background: white; border: 1px solid #ccc; }

        .controls-container { display: flex; flex-direction: column; gap: 10px; }
        .row-1, .row-2, .row-3, .row-4 { display: flex; gap: 8px; width: 100%; align-items: stretch; justify-content: space-between; }
        
        button { border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; font-family: inherit; }
        button:active { transform: scale(0.96); }
        button.keyboard-active { transform: scale(0.96); filter: brightness(0.9); }
        
        .row-1 > button, .row-2 > button, .row-3 > button, .row-4 > button { flex: 1; padding: 12px 4px; font-size: 13px; font-weight: bold; white-space: nowrap; letter-spacing: -0.5px; }
        
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-download { background-color: #059669; color: white; }
        .btn-upload { background-color: #d97706; color: white; } 
        .btn-upload-folder { background-color: #ea580c; color: white; } 
        .btn-info { background-color: #0284c7; color: white; }
        
        .btn-nav { background-color: #4b5563; color: white; flex: 0.8 !important; font-size: 16px !important; }
        
        /* 주목 버튼 스타일 */
        .btn-focus { background-color: #f59e0b; color: white; flex: 1.2 !important; padding: 12px 2px; }
        .btn-focus.active { background-color: #fde047; color: black; box-shadow: 0 0 10px rgba(253,224,71,0.6); }

        .btn-review { background-color: #9333ea; color: white; flex: 1.2 !important; padding: 12px 2px;}
        .btn-capture { background-color: #be185d; color: white; flex: 1.2 !important; padding: 12px 2px;}
        .btn-review.active { background-color: #dc2626; animation: pulse 1.5s infinite; }

        .btn-folder-nav { background-color: #374151; color: white; font-size: 11px !important; flex: 1 !important; padding: 10px 2px !important; letter-spacing: -0.5px; }
        .btn-detail { background-color: #0f766e; color: white; font-size: 14px !important; }
        .btn-detail:disabled { background-color: #4b5563; color: #9ca3af; cursor: not-allowed; opacity: 0.75; }
        .btn-detail:disabled:active { transform: none; }
        
        .row-3, .row-4 { display: none; } /* 폴더 로드 전에 숨김 */
        /* 카운터 박스 다크 모드 적용 */
        .problem-counter-box { flex: 1.2; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: bold; align-self: stretch; background: #2d2d2d; border-radius: 6px; border: 1px solid #444; color: #f3f4f6; }
        /* 입력창 다크 모드 적용 - 텍스트 입력 가능하도록 변경 */
        #problem-number-input { width: 45px; min-width: 0; padding: 4px 2px; text-align: center; font-size: 13px; font-weight: bold; border: 1px solid #555; border-radius: 5px; outline: none; background: #1f2937; color: #f3f4f6; }
        #problem-number-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.3); }
        #problem-total { min-width: 16px; text-align: left; }

        /* 수순 입력창 다크 모드 적용 */
        #move-input { width: 55px; flex-shrink: 0; text-align: center; font-size: 15px; font-weight: bold; border: 2px solid #555; border-radius: 6px; outline: none; background: #1f2937; color: #f3f4f6; }
        #move-input:focus { border-color: #4f46e5; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 모바일 대응: 세로 배치로 변경 및 배경 검은색 유지 */
        @media (max-width: 800px) {
            body { padding: 0; background-color: #000000; align-items: flex-start; }
            .container { flex-direction: column; align-items: center; padding: 10px; border-radius: 0; box-shadow: none; gap: 15px; background: transparent; }
            #board-container { border-left: none; border-right: none; border-radius: 0; max-width: 100vw; flex: none; }
            .sidebar { flex: none; max-width: max(300px, calc(100vh - 220px)); }
            .row-1 > button, .row-2 > button, .row-3 > button, .row-4 > button { font-size: 11px; padding: 8px 1px; }
            .btn-folder-nav { font-size: 10px !important; padding: 8px 1px !important; letter-spacing: -1px; }
            .problem-counter-box { padding: 4px 1px; font-size: 11px; flex: 1.2; }
            #problem-number-input { width: 40px; font-size: 11px; padding: 2px 1px; }
            #problem-total { min-width: 16px; }
            #move-input { width: 45px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="board-container">
        <svg id="baduk-board" viewBox="0 0 400 400"></svg>
    </div>

    <div class="sidebar">
        <div class="status-box">
            <span id="turn-color" class="turn-indicator turn-B"></span>
            <span id="status-text">대기 중</span>
        </div>

        <input type="file" id="sgf-file-input" accept=".sgf" style="display: none;" onchange="loadSGFFile(event)">
        <input type="file" id="sgf-folder-input" webkitdirectory directory multiple style="display: none;" onchange="loadSGFFolder(event)">

        <div class="controls-container">
            <div class="row-1">
                <button class="btn-primary" onclick="copyLink()">🔗 링크복사</button>
                <button class="btn-download" onclick="downloadSGF()">💾 SGF저장</button>
                <button class="btn-upload" onclick="document.getElementById('sgf-file-input').click()">📂 파일열기</button>
                <button class="btn-upload-folder" onclick="document.getElementById('sgf-folder-input').click()">📁 폴더열기</button>
                <button class="btn-info" onclick="toggleMoveNumbers()">🔢 수순보기</button>
            </div>
            <div class="row-2">
                <button id="btn-prev-move" class="btn-nav" onclick="goPrevMove()" title="왼쪽 방향키 / S (항상 사용 가능)">◀</button>
                <input type="number" id="move-input" min="0" value="0" onkeydown="handleInputEnter(event)" onblur="jumpToMove()">
                <button id="btn-next-move" class="btn-nav" onclick="goNextMove()" title="오른쪽 방향키 / F (항상 사용 가능)">▶</button>
                <button id="btn-focus" class="btn-focus" onclick="toggleFocusMove()" title="현재 수순을 링크에 강조">⭐ 주목</button>
                <button id="btn-review" class="btn-review" onclick="toggleReviewMode()" title="E">🔍 검토</button>
                <button class="btn-capture" onclick="captureBoard()">📸 캡쳐</button>
            </div>
            <div class="row-3" id="problem-nav">
                <button id="btn-prev-problem" class="btn-folder-nav" onclick="prevProblem()" title="Shift+W / Shift+PageUp">⏮ 이전문제</button>
                <button id="btn-prev-scene" class="btn-folder-nav" onclick="prevScene()" title="W / PageUp">◀ 이전장면</button>
                <div class="problem-counter-box" id="problem-counter" title="문제 번호를 클릭해서 직접 입력할 수 있습니다.">
                    <input type="text" id="problem-number-input" value="1-1" onkeydown="handleProblemInputEnter(event)" onblur="jumpToProblem()">
                    <span>/</span>
                    <span id="problem-total">0</span>
                </div>
                <button id="btn-next-scene" class="btn-folder-nav" onclick="nextScene()" title="R / PageDown">다음장면 ▶</button>
                <button id="btn-next-problem" class="btn-folder-nav" onclick="nextProblem()" title="Shift+R / Shift+PageDown">다음문제 ⏭</button>
            </div>
            <div class="row-4" id="detail-nav">
                <button id="btn-detail" class="btn-detail" onclick="openDetailSolution()" disabled title="현재 SGF에 상세풀이 URL이 없습니다.">📖 상세풀이</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chars = 'abcdefghijklmnopqrs';
    const svg = document.getElementById('baduk-board');
    const pad = 20, step = 20;

    let currentMoveIndex = 0;       
    let showMoveNumbers = false;    
    let isReviewMode = false;       
    let savedReviewState = null;    

    // 내부 상태 변경에 의한 해시 변경 감지를 위한 플래그
    let internalHashChange = false;

    // 폴더 내 문제 관리 변수
    const FOLDER_URL_PREFIX = 'FOLDER1:';
    let folderProblems = [];
    let currentFileIndex = -1;
    let isFolderMode = false;
    let currentFolderHash = '';
    let currentFolderViewBox = '0 0 400 400';
    let currentBoardSizeRendered = -1;

    // 바둑판 크기에 맞는 격자선과 화점 생성 (3D 효과 추가)
    function drawBoardGrid(bSize = 19) {
        if (currentBoardSizeRendered === bSize) return;
        currentBoardSizeRendered = bSize;

        let html = `
        <defs>
            <filter id="stone-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
            </filter>
            <radialGradient id="grad-black" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777" />
                <stop offset="30%" stop-color="#222" />
                <stop offset="100%" stop-color="#050505" />
            </radialGradient>
            <radialGradient id="grad-white" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fff" />
                <stop offset="70%" stop-color="#e3e3e3" />
                <stop offset="100%" stop-color="#b3b3b3" />
            </radialGradient>
        </defs>
        <g id="grid-lines">`;
        
        let maxPos = pad + (bSize - 1) * step;
        for(let i = 0; i < bSize; i++) {
            let pos = pad + i * step;
            html += `<line x1="${pad}" y1="${pos}" x2="${maxPos}" y2="${pos}" stroke="#331e0b" stroke-width="0.8"/>`;
            html += `<line x1="${pos}" y1="${pad}" x2="${pos}" y2="${maxPos}" stroke="#331e0b" stroke-width="0.8"/>`;
        }
        
        let stars = [];
        if (bSize === 19) {
            stars = [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
        } else if (bSize === 13) {
            stars = [[3,3],[3,9],[9,3],[9,9],[6,6]];
        } else if (bSize === 9) {
            stars = [[2,2],[2,6],[6,2],[6,6],[4,4]];
        } else if (bSize > 7) {
            let d = bSize >= 12 ? 3 : 2;
            let mid = Math.floor(bSize / 2);
            stars = [[d,d], [d, bSize-1-d], [bSize-1-d, d], [bSize-1-d, bSize-1-d]];
            if (bSize % 2 === 1) stars.push([mid, mid]);
        }
        stars.forEach(([cx, cy]) => {
            html += `<circle cx="${pad + cx * step}" cy="${pad + cy * step}" r="2.5" fill="#221105"/>`;
        });
        html += `</g><g id="stones"></g>`;
        svg.innerHTML = html;
    }

    // 해시 파싱 (주목 5xx5 마커 추출 및 제거 기능 포함)
    function parseHashData(hashString) {
        let setupB = "", setupW = "", moves = "";
        
        if (hashString.includes('B') || hashString.includes('W') || hashString.includes('_')) {
            let parts = hashString.split('_');
            let setupPart = parts[0];
            moves = parts[1] || "";
            
            let bIdx = setupPart.indexOf('B');
            let wIdx = setupPart.indexOf('W');
            
            if (bIdx !== -1 && wIdx !== -1) {
                if (bIdx < wIdx) {
                    setupB = setupPart.substring(bIdx + 1, wIdx);
                    setupW = setupPart.substring(wIdx + 1);
                } else {
                    setupW = setupPart.substring(wIdx + 1, bIdx);
                    setupB = setupPart.substring(bIdx + 1);
                }
            } else if (bIdx !== -1) {
                setupB = setupPart.substring(bIdx + 1);
            } else if (wIdx !== -1) {
                setupW = setupPart.substring(wIdx + 1);
            }
        } else {
            moves = hashString;
        }

        // '5xx5' 형식의 주목 마커 감지 및 추출
        let focusMoveIndex = -1;
        let match = moves.match(/5([a-zA-Z]{2})5/);
        if (match) {
            // '5' 앞의 글자 수를 2로 나누면 이전 수순의 개수가 됨. +1을 하여 주목된 수순 번호를 얻음
            focusMoveIndex = match.index / 2 + 1;
            // 내부 계산 및 렌더링에 방해되지 않도록 '5' 문자를 모두 제거 (순수 수순 데이터만 남김)
            moves = moves.replace(/5([a-zA-Z]{2})5/g, '$1');
        }

        return { setupB, setupW, moves, focusMoveIndex };
    }

    // 셋업, 순수 수순, 그리고 주목할 수순 인덱스를 바탕으로 해시 문자열 생성
    function buildHash(setupB, setupW, moves, focusIndex) {
        let movesWithFocus = moves;
        // 주목할 수순이 유효 범위 내에 있으면 5xx5 형식으로 감싸기
        if (focusIndex > 0 && focusIndex <= moves.length / 2) {
            let insertPos = (focusIndex - 1) * 2;
            movesWithFocus = moves.substring(0, insertPos) + "5" + moves.substring(insertPos, insertPos + 2) + "5" + moves.substring(insertPos + 2);
        }
        
        let hash = "";
        if (setupB || setupW) {
            if (setupB) hash += "B" + setupB;
            if (setupW) hash += "W" + setupW;
            hash += "_" + movesWithFocus;
        } else {
            hash = movesWithFocus;
        }
        return hash;
    }

    function setHashInternally(newHash) {
        internalHashChange = true;
        window.location.hash = newHash;
    }

    function computeBoardState(hashString, maxMoves, boardSize = 19) {
        let board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
        let { setupB, setupW, moves } = parseHashData(hashString); // 주목 마커가 정제된 순수 수순 데이터 반환
        
        if(maxMoves !== undefined) {
            moves = moves.substring(0, maxMoves * 2);
        }

        for (let i = 0; i < setupB.length; i += 2) {
            let x = chars.indexOf(setupB[i]), y = chars.indexOf(setupB[i+1]);
            if (x >= 0 && x < boardSize && y >= 0 && y < boardSize) board[y][x] = { color: 'B', moveNum: 0 };
        }
        for (let i = 0; i < setupW.length; i += 2) {
            let x = chars.indexOf(setupW[i]), y = chars.indexOf(setupW[i+1]);
            if (x >= 0 && x < boardSize && y >= 0 && y < boardSize) board[y][x] = { color: 'W', moveNum: 0 };
        }

        let moveCount = 0;
        let lastX = -1, lastY = -1;

        for (let i = 0; i < moves.length; i += 2) {
            let x = chars.indexOf(moves[i]), y = chars.indexOf(moves[i+1]);
            if (x >= 0 && x < boardSize && y >= 0 && y < boardSize) {
                if (board[y][x] !== null) continue;
                moveCount++;
                let color = (moveCount % 2 !== 0) ? 'B' : 'W';
                board[y][x] = { color: color, moveNum: moveCount };
                lastX = x; lastY = y;

                let opponent = color === 'B' ? 'W' : 'B';
                let dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                
                dirs.forEach(([dx, dy]) => {
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < boardSize && ny >= 0 && ny < boardSize && board[ny][nx] && board[ny][nx].color === opponent) {
                        let group = [], liberties = new Set(), visited = Array(boardSize).fill(false).map(() => Array(boardSize).fill(false));
                        function dfs(cx, cy) {
                            visited[cy][cx] = true; group.push({x: cx, y: cy});
                            dirs.forEach(([idx, idy]) => {
                                let nnx = cx + idx, nny = cy + idy;
                                if (nnx >= 0 && nnx < boardSize && nny >= 0 && nny < boardSize) {
                                    if (board[nny][nnx] === null) liberties.add(`${nnx},${nny}`);
                                    else if (board[nny][nnx] && board[nny][nnx].color === opponent && !visited[nny][nnx]) dfs(nnx, nny);
                                }
                            });
                        }
                        dfs(nx, ny);
                        if (liberties.size === 0) group.forEach(p => { board[p.y][p.x] = null; });
                    }
                });
                
                let ownLiberties = new Set(), ownVisited = Array(boardSize).fill(false).map(() => Array(boardSize).fill(false));
                function dfsOwn(cx, cy) {
                    ownVisited[cy][cx] = true;
                    dirs.forEach(([idx, idy]) => {
                        let nnx = cx + idx, nny = cy + idy;
                        if (nnx >= 0 && nnx < boardSize && nny >= 0 && nny < boardSize) {
                            if (board[nny][nnx] === null) ownLiberties.add(`${nnx},${nny}`);
                            else if (board[nny][nnx] && board[nny][nnx].color === color && !ownVisited[nny][nnx]) dfsOwn(nnx, nny);
                        }
                    });
                }
                dfsOwn(x, y);
                if (ownLiberties.size === 0) { 
                    board[y][x] = null; 
                    moveCount--; 
                    if(i === moves.length - 2) { lastX = -1; lastY = -1; } 
                }
            }
        }
        return { board, moveCount, lastX, lastY };
    }

    function getProblemViewBox(hashString) {
        const { setupB, setupW, moves } = parseHashData(hashString);
        const points = [];

        function addCoords(coordString) {
            for (let i = 0; i + 1 < coordString.length; i += 2) {
                const x = chars.indexOf(coordString[i]);
                const y = chars.indexOf(coordString[i + 1]);
                if (x >= 0 && x < 19 && y >= 0 && y < 19) {
                    points.push({ x, y });
                }
            }
        }

        addCoords(setupB);
        addCoords(setupW);
        addCoords(moves);

        if (points.length === 0) return '0 0 400 400';

        let minX = Math.min(...points.map(p => p.x));
        let maxX = Math.max(...points.map(p => p.x));
        let minY = Math.min(...points.map(p => p.y));
        let maxY = Math.max(...points.map(p => p.y));

        const nearLeftEdge = minX <= 3;
        const nearRightEdge = maxX >= 15;
        const nearTopEdge = minY <= 3;
        const nearBottomEdge = maxY >= 15;

        const contentMargin = 1;
        const cornerMargin = 1.25;

        let left = nearLeftEdge
            ? pad + (0 - cornerMargin) * step
            : pad + (minX - contentMargin) * step;
        let right = nearRightEdge
            ? pad + (18 + cornerMargin) * step
            : pad + (maxX + contentMargin) * step;
        let top = nearTopEdge
            ? pad + (0 - cornerMargin) * step
            : pad + (minY - contentMargin) * step;
        let bottom = nearBottomEdge
            ? pad + (18 + cornerMargin) * step
            : pad + (maxY + contentMargin) * step;

        let width = right - left;
        let height = bottom - top;
        let side = Math.max(width, height);

        if (nearLeftEdge) {
            right = left + side;
        } else if (nearRightEdge) {
            left = right - side;
        } else {
            const centerX = (left + right) / 2;
            left = centerX - side / 2;
            right = centerX + side / 2;
        }

        if (nearTopEdge) {
            bottom = top + side;
        } else if (nearBottomEdge) {
            top = bottom - side;
        } else {
            const centerY = (top + bottom) / 2;
            top = centerY - side / 2;
            bottom = centerY + side / 2;
        }

        const finalSide = Math.max(right - left, bottom - top);
        if (finalSide <= 0) return '0 0 400 400';

        return `${left} ${top} ${finalSide} ${finalSide}`;
    }

    function getFolderProblemViewBox(problem) {
        const bSize = problem.boardSize || 19;
        if (bSize !== 19) {
            const totalLength = pad * 2 + (bSize - 1) * step;
            return `0 0 ${totalLength} ${totalLength}`;
        }
        return getProblemViewBox(problem.hash);
    }

    function applyBoardViewBox() {
        svg.setAttribute('viewBox', isFolderMode ? currentFolderViewBox : '0 0 400 400');
    }

    function render() {
        let activeProblem = (isFolderMode && folderProblems[currentFileIndex]) ? folderProblems[currentFileIndex] : null;
        let bSize = activeProblem ? (activeProblem.boardSize || 19) : 19;

        drawBoardGrid(bSize);
        applyBoardViewBox();

        let hash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { board, moveCount, lastX, lastY } = computeBoardState(hash, currentMoveIndex, bSize);
        let stonesGroup = document.getElementById('stones');
        let html = '';
        
        for (let y = 0; y < bSize; y++) {
            for (let x = 0; x < bSize; x++) {
                if (board[y][x] !== null) {
                    let stone = board[y][x];
                    let cx = pad + x * step, cy = pad + y * step;
                    let isLast = (x === lastX && y === lastY);
                    
                    if (stone.color === 'B') {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="url(#grad-black)" filter="url(#stone-shadow)"/>`;
                    } else {
                        html += `<circle cx="${cx}" cy="${cy}" r="9.3" fill="url(#grad-white)" filter="url(#stone-shadow)"/>`;
                    }

                    if (showMoveNumbers && stone.moveNum > 0) {
                        let textColor = stone.color === 'B' ? 'white' : 'black';
                        let fontSize = stone.moveNum >= 100 ? 9 : 10;
                        html += `<text x="${cx}" y="${cy}" fill="${textColor}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" style="text-shadow: 0px 1px 2px rgba(0,0,0,0.4);">${stone.moveNum}</text>`;
                    } else if (isLast && !showMoveNumbers) {
                        let markerColor = stone.color === 'B' ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 0, 0, 0.7)';
                        html += `<circle cx="${cx}" cy="${cy}" r="2.5" fill="${markerColor}"/>`;
                    }
                }
            }
        }
        stonesGroup.innerHTML = html;
        
        let nextColor = (moveCount % 2 === 0) ? 'B' : 'W';
        document.getElementById('turn-color').className = `turn-indicator turn-${nextColor}`;
        let modeText = isReviewMode ? "[검토중] " : "";
        document.getElementById('status-text').innerText = `${modeText}${nextColor === 'B' ? '흑' : '백'}의 차례 (현재 ${moveCount}수)`;
        document.getElementById('move-input').value = moveCount;

        // 주목 수순 시각적 강조
        let { focusMoveIndex } = parseHashData(hash);
        let btnFocus = document.getElementById('btn-focus');
        if (btnFocus) {
            if (focusMoveIndex !== -1 && currentMoveIndex === focusMoveIndex && currentMoveIndex > 0) {
                btnFocus.classList.add('active');
            } else {
                btnFocus.classList.remove('active');
            }
        }
    }

    document.getElementById('board-container').addEventListener('click', function(e) {
        if (isFolderMode && !isReviewMode) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                goNextMove();
            } else {
                goPrevMove();
            }
            return;
        }

        const ctm = svg.getScreenCTM();
        if (!ctm) return;

        const point = svg.createSVGPoint();
        point.x = e.clientX;
        point.y = e.clientY;
        const svgPoint = point.matrixTransform(ctm.inverse());

        let gridX = Math.round((svgPoint.x - pad) / step);
        let gridY = Math.round((svgPoint.y - pad) / step);

        let activeProblem = (isFolderMode && folderProblems[currentFileIndex]) ? folderProblems[currentFileIndex] : null;
        let bSize = activeProblem ? (activeProblem.boardSize || 19) : 19;

        if (gridX >= 0 && gridX < bSize && gridY >= 0 && gridY < bSize) {
            let currentHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
            
            let { board } = computeBoardState(currentHash, currentMoveIndex, bSize);
            if (board[gridY][gridX] !== null) {
                return; 
            }
            
            let { setupB, setupW, moves, focusMoveIndex } = parseHashData(currentHash);
            
            moves = moves.substring(0, currentMoveIndex * 2);
            let nextMove = chars[gridX] + chars[gridY];
            let newMoves = moves + nextMove;
            
            // 기존에 주목 마커가 있었는데 새 수를 둠으로써 그 이후 수순이 잘려나갔다면 마커 해제
            let newFocus = (focusMoveIndex > 0 && focusMoveIndex <= currentMoveIndex) ? focusMoveIndex : -1;
            let newHash = buildHash(setupB, setupW, newMoves, newFocus);
            
            if (isFolderMode) {
                currentFolderHash = newHash;
                currentMoveIndex = newMoves.length / 2;
                render();
            } else {
                currentMoveIndex = newMoves.length / 2;
                setHashInternally(newHash);
            }
        }
    });

    window.addEventListener('hashchange', () => {
        if (internalHashChange) {
            internalHashChange = false;
            render();
            return;
        }

        if (loadFolderFromUrl()) {
            render();
            return;
        }

        isFolderMode = false;
        folderProblems = [];
        currentFileIndex = -1;
        currentFolderHash = '';
        currentFolderViewBox = '0 0 400 400';
        document.getElementById('problem-nav').style.display = 'none';
        document.getElementById('detail-nav').style.display = 'none';

        let currentHash = window.location.hash.substring(1);
        let { moves, focusMoveIndex } = parseHashData(currentHash);

        if (window.isSgfFileLoading) {
            if (window.loadedSgfIsProblem) {
                currentMoveIndex = 0;
            } else {
                // SGF 로딩 시 주목 정보가 있으면 점프
                currentMoveIndex = focusMoveIndex !== -1 ? focusMoveIndex : moves.length / 2;
            }
            window.isSgfFileLoading = false;
        } else {
            // 외부 링크나 앞으로/뒤로가기로 인한 해시 변경 시 주목 수순 우선 이동
            currentMoveIndex = focusMoveIndex !== -1 ? focusMoveIndex : moves.length / 2;
        }
        render();
    });

    function toggleMoveNumbers() { showMoveNumbers = !showMoveNumbers; render(); }
    function goPrevMove() { if (currentMoveIndex > 0) { currentMoveIndex--; render(); } }
    function goNextMove() {
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { moves } = parseHashData(activeHash);
        if (currentMoveIndex < moves.length / 2) { currentMoveIndex++; render(); }
    }
    function handleInputEnter(e) { if (e.key === 'Enter') document.getElementById('move-input').blur(); }
    function jumpToMove() {
        let targetMove = parseInt(document.getElementById('move-input').value);
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { moves } = parseHashData(activeHash);
        let maxMoves = moves.length / 2;
        if (isNaN(targetMove) || targetMove < 0) targetMove = 0;
        if (targetMove > maxMoves) targetMove = maxMoves;
        currentMoveIndex = targetMove; render();
    }

    function toggleFocusMove() {
        if (currentMoveIndex === 0) {
            alert("수순이 하나 이상 진행된 상태에서만 주목할 수 있습니다.");
            return;
        }

        let currentHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { setupB, setupW, moves, focusMoveIndex } = parseHashData(currentHash);

        // 이미 현재 수순에 주목 마커가 있다면 해제(-1), 아니라면 현재 수순으로 갱신
        let newFocus = (focusMoveIndex === currentMoveIndex) ? -1 : currentMoveIndex;
        let newHash = buildHash(setupB, setupW, moves, newFocus);

        if (isFolderMode) {
            currentFolderHash = newHash;
            if (folderProblems[currentFileIndex]) {
                folderProblems[currentFileIndex].hash = newHash;
            }
            history.replaceState(null, null, '#' + getFolderUrlHash());
            render();
        } else {
            setHashInternally(newHash); // 현재 수순을 유지하며 해시만 업데이트
        }
    }

    function toggleReviewMode() {
        let btn = document.getElementById('btn-review');
        isReviewMode = !isReviewMode;

        if (isReviewMode) {
            savedReviewState = {
                hash: isFolderMode ? currentFolderHash : window.location.hash.substring(1),
                index: currentMoveIndex,
                folderProblemHash: isFolderMode && folderProblems[currentFileIndex]
                    ? folderProblems[currentFileIndex].hash
                    : null
            };
            btn.classList.add('active');
            btn.innerText = '🛑 검토 종료';

            let { setupB, setupW, moves, focusMoveIndex } = parseHashData(isFolderMode ? currentFolderHash : window.location.hash.substring(1));
            moves = moves.substring(0, currentMoveIndex * 2);
            let newFocus = (focusMoveIndex > 0 && focusMoveIndex <= currentMoveIndex) ? focusMoveIndex : -1;
            let newHash = buildHash(setupB, setupW, moves, newFocus);

            if (isFolderMode) {
                currentFolderHash = newHash;
                currentMoveIndex = moves.length / 2;
                render();
            } else {
                currentMoveIndex = moves.length / 2;
                setHashInternally(newHash);
            }
        } else {
            if (isFolderMode) {
                currentFolderHash = savedReviewState.hash;
                currentMoveIndex = savedReviewState.index;
                if (folderProblems[currentFileIndex] && savedReviewState.folderProblemHash !== null) {
                    folderProblems[currentFileIndex].hash = savedReviewState.folderProblemHash;
                }
                render();
            } else {
                currentMoveIndex = savedReviewState.index;
                setHashInternally(savedReviewState.hash || '');
            }
            savedReviewState = null;
            btn.classList.remove('active');
            btn.innerText = '🔍 검토';
        }
    }

    function pressButton(buttonId) {
        const button = document.getElementById(buttonId);
        if (!button || button.disabled) return;

        button.classList.add('keyboard-active');
        button.click();
        window.setTimeout(() => button.classList.remove('keyboard-active'), 120);

    document.addEventListener('keydown', (e) => {
        const activeElement = document.activeElement;
        if (activeElement && (
            activeElement.tagName === 'INPUT' ||
            activeElement.tagName === 'TEXTAREA' ||
            activeElement.isContentEditable
        )) {
            return;
        }

        if (e.ctrlKey || e.altKey || e.metaKey) return;

        const key = e.key.toLowerCase();

        if (e.key === 'ArrowLeft' || key === 's') {
            e.preventDefault();
            pressButton('btn-prev-move');
        } else if (e.key === 'ArrowRight' || key === 'f') {
            e.preventDefault();
            pressButton('btn-next-move');
        } else if (key === 'd') {
            e.preventDefault();
            pressButton('btn-detail');
        } else if (key === 'e') {
            e.preventDefault();
            pressButton('btn-review');
        } else if (e.key === 'PageUp' || key === 'w') {
            e.preventDefault();
            if (e.shiftKey) {
                pressButton('btn-prev-problem');
            } else {
                pressButton('btn-prev-scene');
            }
        } else if (e.key === 'PageDown' || key === 'r') {
            e.preventDefault();
            if (e.shiftKey) {
                pressButton('btn-next-problem');
            } else {
                pressButton('btn-next-scene');
            }
        }
    });

    function captureBoard() {
        const svgElement = document.getElementById('baduk-board');
        let svgString = new XMLSerializer().serializeToString(svgElement);
        if (!svgString.includes('xmlns="http://www.w3.org/2000/svg"')) svgString = svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');

        const size = 800; 
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        // 변경된 바둑판 단색 컬러와 동일하게 캡쳐 배경색 설정
        ctx.fillStyle = '#9e7646'; ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#523114'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, size, size);

        const img = new Image();
        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.drawImage(img, 0, 0, size, size);
            URL.revokeObjectURL(url);
            const a = document.createElement('a');
            a.download = `baduk_capture_${new Date().toISOString().slice(0,10).replace(/-/g, "")}.png`;
            a.href = canvas.toDataURL('image/png');
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };
        img.src = url;
    }

    function extractDetailUrl(content) {
        if (typeof content !== 'string' || !content) return '';

        const problemMatch = content.match(/101weiqi\s+problem\s+(\d+)/i);
        if (problemMatch && problemMatch[1]) {
            return `https://www.101weiqi.com/q/${problemMatch[1]}/`;
        }

        const normalized = content
            .replace(/\\\r?\n/g, '')
            .replace(/\\:/g, ':')
            .replace(/\\\//g, '/');

        const urlMatches = normalized.match(/https?:\/\/[^\s\]\[<>"']+/gi);
        if (urlMatches && urlMatches.length > 0) {
            return urlMatches[0].replace(/[.,;!?]+$/, ''); 
        }

        return '';
    }

    function processSgfContent(content, applyToUrl = true, fileNameIndex = 1) {
        let boardSize = 19;
        let szMatch = content.match(/SZ\[(\d+)\]/i);
        if (szMatch) {
            boardSize = parseInt(szMatch[1], 10);
        }

        let problem_node = content;
        let remainder = "";
        let nodeStart = content.indexOf('(;');
        if (nodeStart !== -1) {
            let insideBracket = false, escapeNext = false;
            for(let i = nodeStart + 2; i < content.length; i++) {
                let char = content[i];
                if(escapeNext) { escapeNext = false; continue; }
                if(char === '\\') { escapeNext = true; continue; }
                if(char === '[') insideBracket = true;
                else if(char === ']') insideBracket = false;
                else if(!insideBracket) {
                    if(char === ';' || char === '(') {
                        problem_node = content.substring(0, i).trim();
                        if(!problem_node.endsWith(')')) problem_node += ')';
                        remainder = content.substring(i);
                        if(remainder.startsWith(';')) remainder = '(' + remainder;
                        break;
                    } else if (char === ')') {
                        problem_node = content.substring(0, i+1);
                        break;
                    }
                }
            }
        }

        let isProblem = problem_node.includes('AB[') || problem_node.includes('AW[');
        let flipX = false, flipY = false, isWhiteFirst = false;

        if (isProblem) {
            let allCoords = [];
            let coordRegex = /(AB|AW|AE|B|W|TB|TW|TR|SQ|CR|MA)((?:[\s]*\[[a-zA-Z]{2}\])+)/g;
            let match;
            while((match = coordRegex.exec(content)) !== null) {
                let coords = match[2].match(/\[([a-zA-Z]{2})\]/g);
                if(coords) {
                    coords.forEach(c => {
                        let x = c.charCodeAt(1) - 97, y = c.charCodeAt(2) - 97;
                        if(x >= 0 && x < boardSize && y >= 0 && y < boardSize) allCoords.push({x, y});
                    });
                }
            }
            if(allCoords.length > 0) {
                let avgX = allCoords.reduce((sum, c) => sum + c.x, 0) / allCoords.length;
                let avgY = allCoords.reduce((sum, c) => sum + c.y, 0) / allCoords.length;
                flipX = avgX > (boardSize / 2 - 0.5);
                flipY = avgY < (boardSize / 2 - 0.5);
            }
            let firstMoveMatch = remainder.match(/;([BW])\[/i);
            if (firstMoveMatch && firstMoveMatch[1].toUpperCase() === 'W') {
                isWhiteFirst = true;
            }
        }

        function transformStr(str) {
            let x = str.charCodeAt(0) - 97, y = str.charCodeAt(1) - 97;
            let nx = flipX ? (boardSize - 1) - x : x;
            let ny = flipY ? (boardSize - 1) - y : y;
            return String.fromCharCode(nx + 97) + String.fromCharCode(ny + 97);
        }

        let setupB_arr = [], setupW_arr = [];
        let abMatches = problem_node.match(/AB(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(abMatches) {
            abMatches.forEach(m => {
                let coords = m.match(/\[([a-zA-Z]{2})\]/g);
                if(coords) coords.forEach(c => setupB_arr.push(c.slice(1,3).toLowerCase()));
            });
        }
        let awMatches = problem_node.match(/AW(?:[\s]*\[[a-zA-Z]{2}\])+/g);
        if(awMatches) {
            awMatches.forEach(m => {
                let coords = m.match(/\[([a-zA-Z]{2})\]/g);
                if(coords) coords.forEach(c => setupW_arr.push(c.slice(1,3).toLowerCase()));
            });
        }

        let finalSetupB = isWhiteFirst ? setupW_arr : setupB_arr;
        let finalSetupW = isWhiteFirst ? setupB_arr : setupW_arr;
        
        let setupB_str = finalSetupB.map(transformStr).join('');
        let setupW_str = finalSetupW.map(transformStr).join('');

        let allPaths = [], currentPath = [], stack = [], lastOp = null, i = 0;
        while (i < remainder.length) {
            let c = remainder[i];
            if (c === '(') {
                stack.push([...currentPath]); lastOp = '('; i++;
            } else if (c === ')') {
                if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);
                if (stack.length > 0) currentPath = stack.pop();
                lastOp = ')'; i++;
            } else if (c === ';') {
                let start = i; i++;
                let inBracket = false, escape = false;
                while (i < remainder.length) {
                    let ch = remainder[i];
                    if (escape) escape = false;
                    else if (ch === '\\') escape = true;
                    else if (ch === '[') inBracket = true;
                    else if (ch === ']') inBracket = false;
                    else if (!inBracket && (ch === ';' || ch === '(' || ch === ')')) break;
                    i++;
                }
                currentPath.push(remainder.substring(start, i)); lastOp = 'node';
            } else {
                i++;
            }
        }
        if (lastOp === 'node' && currentPath.length > 0) allPaths.push([...currentPath]);

        if (allPaths.length === 0) allPaths.push([]); 

        let hasSetup = (setupB_str.length > 0 || setupW_str.length > 0);

        let branchesInfo = allPaths.map((path, idx) => {
            let movesHash = "";
            path.forEach(node => {
                let moveMatch = [...node.matchAll(/[BW]\[([a-zA-Z]{2})\]/gi)];
                moveMatch.forEach(m => {
                    movesHash += transformStr(m[1].toLowerCase());
                });
            });
            let newHash = buildHash(setupB_str, setupW_str, movesHash, -1);
            return {
                hash: newHash,
                isProblem: isProblem,
                boardSize: boardSize,
                branchLabel: `${fileNameIndex}-${idx + 1}`
            };
        });

        let correctPaths = allPaths.filter(path => {
            if(path.length === 0) return false;
            let lastNode = path[path.length - 1];
            if(/C\[.*?correct.*?\]/i.test(lastNode) || lastNode.includes('CR[')) return true;
            if(!/[BW]\[[a-zA-Z]{2}\]/.test(lastNode) && path.length > 1) {
                let prevNode = path[path.length - 2];
                if(/C\[.*?correct.*?\]/i.test(prevNode) || prevNode.includes('CR[')) return true;
            }
            return false;
        });

        let targetPaths = correctPaths.length > 0 ? correctPaths : allPaths;
        let bestPath = targetPaths.length > 0 ? targetPaths[0] : [];

        let bestMovesHash = "";
        bestPath.forEach(node => {
            let moveMatch = [...node.matchAll(/[BW]\[([a-zA-Z]{2})\]/gi)];
            moveMatch.forEach(m => {
                bestMovesHash += transformStr(m[1].toLowerCase());
            });
        });

        let bestHash = buildHash(setupB_str, setupW_str, bestMovesHash, -1);

        if (applyToUrl) {
            isFolderMode = false;
            window.isSgfFileLoading = true;
            window.loadedSgfIsProblem = isProblem;
            window.location.hash = bestHash;
        }

        return { 
            hash: bestHash, 
            isProblem: isProblem, 
            boardSize: boardSize, 
            branches: branchesInfo 
        };
    }

    function encodeFolderPayload(data) {
        const bytes = new TextEncoder().encode(JSON.stringify(data));
        let binary = '';
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function decodeFolderPayload(encoded) {
        const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getFolderUrlHash() {
        const payload = {
            version: 1,
            files: folderProblems.map(problem => ({
                name: problem.name,
                hash: problem.hash,
                isProblem: !!problem.isProblem,
                boardSize: problem.boardSize || 19,
                detailUrl: problem.detailUrl || '',
                branchLabel: problem.branchLabel || ''
            }))
        };
        return FOLDER_URL_PREFIX + encodeFolderPayload(payload);
    }

    function updateProblemCounter() {
        let totalProblems = 0;
        if (folderProblems.length > 0) {
            let uniqueProblems = new Set();
            folderProblems.forEach((p, idx) => {
                if (p.branchLabel && p.branchLabel.includes('-')) {
                    uniqueProblems.add(p.branchLabel.split('-')[0]);
                } else {
                    uniqueProblems.add(p.branchLabel || `unknown_${idx}`);
                }
            });
            totalProblems = uniqueProblems.size;

            if (folderProblems[currentFileIndex]) {
                document.getElementById('problem-number-input').value = folderProblems[currentFileIndex].branchLabel || (currentFileIndex + 1);
            }
        } else {
            document.getElementById('problem-number-input').value = "0";
        }
        
        document.getElementById('problem-total').innerText = totalProblems;
        updateDetailButton();
    }

    function getFileNum(branchLabel) {
        if (!branchLabel) return 1;
        let parts = branchLabel.split('-');
        return parseInt(parts[0], 10);
    }

    function prevProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;
        let currentFileNum = getFileNum(folderProblems[currentFileIndex].branchLabel);
        let targetFileNum = currentFileNum - 1;

        if (targetFileNum > 0) {
            let targetIndex = folderProblems.findIndex(p => getFileNum(p.branchLabel) === targetFileNum);
            if (targetIndex !== -1) {
                loadSgfFromFileList(targetIndex);
                return;
            }
        }
        alert("첫 번째 문제입니다.");
    }

    function nextProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;
        let currentFileNum = getFileNum(folderProblems[currentFileIndex].branchLabel);
        let targetFileNum = currentFileNum + 1;

        let targetIndex = folderProblems.findIndex(p => getFileNum(p.branchLabel) === targetFileNum);
        if (targetIndex !== -1) {
            loadSgfFromFileList(targetIndex);
        } else {
            alert("마지막 문제입니다.");
        }
    }

    function handleProblemInputEnter(e) {
        if (e.key === 'Enter') {
            document.getElementById('problem-number-input').blur();
        }
    }

    function jumpToProblem() {
        if (!isFolderMode || folderProblems.length === 0) return;

        let targetValue = document.getElementById('problem-number-input').value.trim();
        
        if (/^\d+$/.test(targetValue)) {
            targetValue += "-1";
        }

        let foundIndex = folderProblems.findIndex(p => p.branchLabel === targetValue);
        
        if (foundIndex !== -1) {
            loadSgfFromFileList(foundIndex);
        } else {
            let targetNum = parseInt(targetValue, 10);
            if (!isNaN(targetNum)) {
                let target = Math.max(1, Math.min(folderProblems.length, targetNum));
                loadSgfFromFileList(target - 1);
            } else {
                updateProblemCounter();
            }
        }
    }

    function loadSgfFromFileList(index) {
        if (index < 0 || index >= folderProblems.length) return;
        currentFileIndex = index;
        const problem = folderProblems[currentFileIndex];
        currentFolderHash = problem.hash;
        currentFolderViewBox = getFolderProblemViewBox(problem);
        
        let { moves, focusMoveIndex } = parseHashData(currentFolderHash);
        
        if (problem.isProblem) {
            currentMoveIndex = 0;
        } else {
            currentMoveIndex = focusMoveIndex !== -1 ? focusMoveIndex : moves.length / 2;
        }
        
        isReviewMode = false;
        let btnReview = document.getElementById('btn-review');
        btnReview.classList.remove('active');
        btnReview.innerText = '🔍 검토';
        savedReviewState = null;

        updateProblemCounter();
        
        const newUrlHash = getFolderUrlHash();
        history.replaceState(null, null, '#' + newUrlHash);
        
        render();
    }

    function loadFolderFromUrl() {
        const hash = window.location.hash.substring(1);
        if (hash.startsWith(FOLDER_URL_PREFIX)) {
            try {
                const encoded = hash.substring(FOLDER_URL_PREFIX.length);
                const payload = decodeFolderPayload(encoded);
                
                if (payload.version === 1 && Array.isArray(payload.files)) {
                    folderProblems = payload.files;
                    isFolderMode = true;
                    document.getElementById('problem-nav').style.display = 'flex';
                    document.getElementById('detail-nav').style.display = 'flex';
                    loadSgfFromFileList(0);
                    return true;
                }
            } catch (e) {
                console.error("폴더 URL 파싱 실패:", e);
                isFolderMode = false;
            }
        }
        return false;
    }

    function loadSGFFolder(event) {
        const files = Array.from(event.target.files).filter(file => file.name.toLowerCase().endsWith('.sgf'));
        if (files.length === 0) {
            alert("선택된 폴더에 SGF 파일이 없습니다.");
            return;
        }
        
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        folderProblems = [];
        let filesProcessed = 0;
        let totalFiles = files.length;
        
        let fileContents = new Array(totalFiles);

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                fileContents[index] = e.target.result;
                filesProcessed++;
                if (filesProcessed === totalFiles) {
                    processAllFiles(fileContents);
                }
            };
            reader.readAsText(file);
        });
        
        event.target.value = '';
    }

    function processAllFiles(contents) {
        folderProblems = [];
        contents.forEach((content, index) => {
            const fileIndex = index + 1;
            const detailUrl = extractDetailUrl(content);
            const result = processSgfContent(content, false, fileIndex);
            
            result.branches.forEach(branch => {
                folderProblems.push({
                    name: `file_${fileIndex}_${branch.branchLabel}`,
                    hash: branch.hash,
                    isProblem: branch.isProblem,
                    boardSize: branch.boardSize,
                    detailUrl: detailUrl,
                    branchLabel: branch.branchLabel
                });
            });
        });

        if (folderProblems.length > 0) {
            isFolderMode = true;
            document.getElementById('problem-nav').style.display = 'flex';
            document.getElementById('detail-nav').style.display = 'flex';
            
            const newUrlHash = getFolderUrlHash();
            history.pushState(null, null, '#' + newUrlHash);
            
            loadSgfFromFileList(0);
        } else {
            alert("유효한 SGF 기보를 찾을 수 없습니다.");
        }
    }

    function loadSGFFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            processSgfContent(content, true);
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    function copyLink() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert('링크가 클립보드에 복사되었습니다.');
        }).catch(err => {
            console.error('복사 실패:', err);
            alert('링크 복사에 실패했습니다.');
        });
    }

    function downloadSGF() {
        let bSize = currentBoardSizeRendered > 0 ? currentBoardSizeRendered : 19;
        let sgfContent = `(;GM[1]FF[4]SZ[${bSize}]`;
        let activeHash = isFolderMode ? currentFolderHash : window.location.hash.substring(1);
        let { setupB, setupW, moves } = parseHashData(activeHash);

        if (setupB.length > 0) {
            sgfContent += "AB";
            for (let i = 0; i < setupB.length; i += 2) sgfContent += `[${setupB.slice(i, i+2)}]`;
        }
        if (setupW.length > 0) {
            sgfContent += "AW";
            for (let i = 0; i < setupW.length; i += 2) sgfContent += `[${setupW.slice(i, i+2)}]`;
        }
        
        for (let i = 0; i < moves.length; i += 2) {
            let color = (i / 2 % 2 === 0) ? 'B' : 'W';
            sgfContent += `;${color}[${moves.slice(i, i+2)}]`;
        }
        sgfContent += ")";
        
        const blob = new Blob([sgfContent], { type: 'application/x-go-sgf' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        let timestamp = new Date().toISOString().slice(0,19).replace(/[:-]/g, "").replace("T", "_");
        a.download = `baduk_${timestamp}.sgf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    window.onload = () => {
        if (!loadFolderFromUrl()) {
            if (window.location.hash) {
                let currentHash = window.location.hash.substring(1);
                let { moves, focusMoveIndex } = parseHashData(currentHash);
                // 주소창에 주목 마커가 있다면 로딩 시 자동으로 해당 수순으로 이동
                currentMoveIndex = focusMoveIndex !== -1 ? focusMoveIndex : moves.length / 2;
                render();
            } else {
                render();
            }
        }
    };
</script>
